<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>《投资学原理》行为投资课堂实验教学 — 张剑</title>
<style>
  :root {
    --bg: #f6f3ec;
    --bg-grad: radial-gradient(circle at 12% 14%, rgba(15, 110, 86, 0.08), transparent 42%),
               radial-gradient(circle at 88% 82%, rgba(29, 93, 143, 0.09), transparent 45%);
    --ink: #18181b;
    --muted: #52525b;
    --paper: #ffffff;
    --paper-soft: #faf8f4;
    --line: #d7cfbe;
    --line-soft: #e8e2d6;
    --accent: #0f6e56;
    --accent-2: #0a4d3c;
    --blue: #1d5d8f;
    --blue-soft: #eef5fb;
    --orange: #c2571a;
    --bad: #b42318;
    --neutral: #8b8375;
    --shadow: 0 2px 4px rgba(24, 24, 27, 0.05), 0 10px 24px rgba(24, 24, 27, 0.07);
    --shadow-sm: 0 1px 2px rgba(24, 24, 27, 0.05), 0 4px 12px rgba(24, 24, 27, 0.06);
    --canvas-w: 1600px;
    --canvas-h: 900px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    background-image: var(--bg-grad);
    color: var(--ink);
    font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    overflow: hidden;
  }
  #app { height: 100%; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
  .stage {
    position: relative;
    width: var(--canvas-w);
    height: var(--canvas-h);
    flex: 0 0 auto;
    transform-origin: center center;
    overflow: hidden;
  }
  .slides { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  body.demo-mode::before {
    content: "评委演示 · 预设样本，非课堂实测";
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%); z-index: 100;
    padding: 3px 14px; border: 1px solid #f2c89c; border-radius: 999px;
    background: #fff8f2; color: #9a4615; font-size: 16px; font-weight: 700;
    pointer-events: none;
  }

  .slide {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    justify-content: center;
    overflow: hidden;
    padding: 20px 44px 26px;
  }
  .slide.on { display: flex; animation: fadeIn .2s ease-out; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes liveBlink {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.38); opacity: .55; }
  }
  @keyframes popDot {
    0% { opacity: 0; transform: scale(0.25) translateY(-8px); }
    70% { opacity: 1; transform: scale(1.1) translateY(0); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes growBarY {
    from { transform: scaleY(0); }
    to { transform: scaleY(1); }
  }
  @keyframes drawCurve {
    from { stroke-dashoffset: 460; }
    to { stroke-dashoffset: 0; }
  }
  .flow-line { stroke-dasharray: 8 6; }
  .flow-line-rev { stroke-dasharray: 8 6; }
  .hub-glow { }
  .slide.on .draw-curve {
    stroke-dasharray: 460;
    animation: drawCurve 1s cubic-bezier(.22, .8, .26, 1) both;
  }
  .slide.on .grow-bar {
    transform-box: fill-box;
    transform-origin: center bottom;
    animation: growBarY .7s cubic-bezier(.2, .85, .25, 1) both;
  }
  .pop-dot {
    transform-box: fill-box;
    transform-origin: center;
    animation: popDot .45s cubic-bezier(.2, .85, .28, 1) both;
  }
  @media (prefers-reduced-motion: reduce) {
    .part-badge i, .slide.on .draw-curve, .slide.on .grow-bar, .pop-dot { animation: none !important; }
  }

  .head-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
  .part-badge {
    display: inline-flex; align-items: center; gap: 7px;
    background: #e8f6f1; color: var(--accent-2);
    border: 1px solid #b7e0d2; border-radius: 999px;
    padding: 4px 13px; font-size: 16px; font-weight: 700;
    white-space: nowrap;
  }
  .part-badge.wait { background: var(--paper-soft); color: var(--muted); border-color: var(--line); }
  .part-badge i {
    width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
    display: inline-block; animation: liveBlink 1.8s ease-in-out infinite;
  }
  .part-badge.wait i { background: #a1a1aa; animation: none; }

  .slide-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line);
    flex: 0 0 auto;
  }
  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(15, 110, 86, 0.1);
    color: var(--accent-2);
    font-size: 18px; font-weight: 700; letter-spacing: .04em;
    padding: 5px 14px; border-radius: 999px;
    white-space: nowrap;
  }
  .pill.blue { background: var(--blue-soft); color: var(--blue); }
  .slide-sub-tag { font-size: 17px; color: var(--muted); font-weight: 500; }

  h1 { font-size: 58px; font-weight: 800; letter-spacing: -.01em; line-height: 1.16; color: var(--ink); }
  h2 { font-size: 42px; font-weight: 700; line-height: 1.22; margin-bottom: 14px; color: var(--ink); text-align: left; }
  .lead { font-size: 26px; line-height: 1.45; color: var(--muted); }
  .body { font-size: 24px; line-height: 1.45; color: var(--ink); }

  /* 封面双栏 */
  .cover-grid {
    display: grid;
    grid-template-columns: 1.24fr 0.76fr;
    gap: 24px;
    align-items: stretch;
    height: 100%;
  }
  .cover-left {
    background: var(--paper);
    border: 1px solid var(--line);
    border-top: 4px solid var(--accent);
    border-radius: 24px;
    padding: 30px 34px;
    box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 16px;
    text-align: left;
  }
  .cover-badge {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: .06em;
    padding: 6px 16px;
    border-radius: 999px;
    margin-bottom: 14px;
  }
  .cover-title-sub { margin-top: 12px; font-size: 22px; color: var(--muted); font-weight: 500; }
  .agent-highlights { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0; }
  .ah-card {
    background: var(--blue-soft);
    border: 1px solid #c9dff0;
    border-left: 4px solid var(--blue);
    border-radius: 14px;
    padding: 12px 14px;
  }
  .ah-card .ah-num { font-size: 16px; font-weight: 800; color: var(--blue); letter-spacing: .05em; }
  .ah-card h4 { font-size: 21px; font-weight: 700; color: var(--ink); margin: 3px 0; }
  .ah-card p { font-size: 17px; color: var(--muted); line-height: 1.4; }

  .author-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 14px; border-top: 1px solid var(--line);
    margin-top: auto;
  }
  .author-name { font-size: 25px; font-weight: 700; color: var(--ink); }

  .cover-right {
    background: linear-gradient(160deg, #0d4b3c 0%, #143d59 100%);
    border-radius: 24px;
    padding: 22px 24px;
    color: #fff;
    box-shadow: var(--shadow);
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .cover-right-head { font-size: 18px; font-weight: 700; letter-spacing: .08em; color: #a7f3d0; }
  .cover-right-foot {
    background: rgba(255,255,255,0.09);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 12px;
    padding: 11px 14px;
    font-size: 17px; line-height: 1.45; color: #e4e4e7; text-align: left;
  }

  /* 课程全局坐标条 */
  .course-chain {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 12px;
    flex: 0 0 auto;
  }
  .cc-node {
    background: var(--paper); border: 1px solid var(--line); border-radius: 12px;
    padding: 9px 13px; text-align: left; font-size: 17px; color: var(--muted);
  }
  .cc-node strong { display: block; font-size: 19px; color: var(--ink); margin-bottom: 2px; }
  .cc-node.active {
    background: #e8f6f1; border: 2px solid var(--accent); color: var(--accent-2);
  }
  .cc-node.active strong { color: var(--accent-2); }

  .svg-card {
    background: var(--paper); border: 1px solid var(--line); border-radius: 18px;
    padding: 12px 18px; box-shadow: var(--shadow);
    display: flex; align-items: center; justify-content: center;
  }
  .svg-card svg { width: 100%; height: auto; display: block; }

  .agent-box {
    margin-top: 10px; background: var(--blue-soft); border: 1.5px solid #bfd7ea;
    border-left: 5px solid var(--blue);
    border-radius: 14px; padding: 10px 16px; text-align: left; font-size: 21px; line-height: 1.45;
  }
  .tag-ai {
    display: inline-block; background: var(--blue); color: #fff;
    font-size: 16px; font-weight: 700; padding: 3px 10px; border-radius: 999px;
    margin-right: 8px; vertical-align: middle;
  }

  button {
    font: inherit; cursor: pointer; border: 0;
    background: var(--accent); color: #fff;
    border-radius: 11px; padding: 9px 18px;
    font-size: 19px; font-weight: 600;
    transition: transform .12s, box-shadow .12s;
  }
  button:hover:not(:disabled) { transform: translateY(-1px); box-shadow: var(--shadow-sm); }
  button.secondary { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  button:disabled { opacity: .4; cursor: default; }

  .bar {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: 8px;
    height: 44px; min-width: min(94vw, 900px);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 14px;
    background: rgba(255, 255, 255, .9);
    border: 1px solid var(--line); border-radius: 999px;
    box-shadow: 0 6px 20px rgba(24, 24, 27, 0.1);
    backdrop-filter: blur(10px); z-index: 30;
    transition: opacity .45s ease, transform .45s ease;
  }
  .bar.idle { opacity: 0; transform: translateX(-50%) translateY(6px); pointer-events: none; }
  .bar button { font-size: 16px; padding: 6px 14px; border-radius: 999px; }
  .dots { display: flex; gap: 5px; align-items: center; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #ddd6c9; border: 0; padding: 0; transition: background .2s; }
  .dot.on { background: var(--accent); transform: scale(1.2); }
  .bar .nav { display: flex; gap: 8px; align-items: center; }
  .page-num { font-size: 15px; color: var(--muted); min-width: 58px; text-align: center; font-weight: 600; }

  .entry { display: grid; grid-template-columns: 1.12fr .88fr; gap: 16px; flex: 1; min-height: 0; }
  .panel {
    background: var(--paper); border: 1px solid var(--line); border-radius: 18px;
    padding: 14px 18px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 9px; min-height: 0; text-align: left;
  }
  .input-row { display: flex; gap: 10px; align-items: stretch; }
  .input-row input { flex: 1; min-width: 0; }
  input[type=text], textarea {
    font: inherit; font-size: 21px; border: 1px solid var(--line); border-radius: 11px;
    padding: 8px 14px; background: var(--paper-soft); color: var(--ink); width: 100%; text-align: left;
  }
  textarea { min-height: 60px; resize: none; }
  .chips { flex: 1; overflow: auto; display: flex; flex-wrap: wrap; gap: 7px; align-content: flex-start; }
  .chips:empty {
    border: 1px dashed var(--line);
    border-radius: 12px;
    align-items: center;
    justify-content: center;
    align-content: center;
    flex: 0 0 auto;
    min-height: 148px;
  }
  .chips:empty::after {
    content: "已录入的报价会在这里按序号排列";
    color: var(--neutral);
    font-size: 17px;
    letter-spacing: .02em;
  }
  .chip { background: #efe8db; border-radius: 999px; padding: 4px 12px; font-size: 19px; display: inline-flex; gap: 6px; align-items: center; }
  .chip button { background: transparent; color: var(--muted); padding: 0; font-size: 18px; line-height: 1; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { background: var(--paper-soft); border: 1px solid var(--line); border-radius: 12px; padding: 9px 14px; }
  .stat .lab { font-size: 17px; color: var(--muted); }
  .stat .val { font-size: 32px; font-weight: 700; margin-top: 2px; }
  .stat.wide { grid-column: 1 / -1; }
  .winners { font-size: 22px; font-weight: 700; color: var(--accent-2); }
  .hidden-until.reveal-on { display: none; }
  body.is-revealed .hidden-until.reveal-on { display: block; }
  .hint { font-size: 17px; color: var(--muted); }

  .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
  .scenario {
    background: var(--paper); border: 1px solid var(--line); border-left: 5px solid var(--orange);
    border-radius: 16px;
    padding: 16px 20px; box-shadow: var(--shadow); font-size: 23px; line-height: 1.45;
    margin-bottom: 10px; text-align: left;
  }
  .votes { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin: 6px 0; }
  .vote {
    min-width: 240px; background: var(--paper); color: var(--ink); border: 2px solid var(--line);
    border-radius: 16px; padding: 10px 20px; font-size: 21px;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .vote .cnt { font-size: 40px; font-weight: 800; line-height: 1.1; color: var(--accent); }
  .compare2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 4px; }
  .grid-2col { display: grid; grid-template-columns: 1.12fr .88fr; gap: 16px; align-items: center; }

  .roadmap { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 2px; flex: 0 0 auto; }
  .road {
    background: var(--paper); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 14px; box-shadow: var(--shadow-sm); text-align: left; border-top: 4px solid var(--accent);
  }
  .road .num { color: var(--accent); font-weight: 800; font-size: 16px; letter-spacing: .04em; }
  .road h3 { font-size: 24px; margin: 3px 0; }
  .road p { font-size: 18px; color: var(--muted); line-height: 1.35; }

  .formula-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 10px 0; }
  .f-card { background: var(--paper); border: 1px solid var(--line); border-top: 4px solid var(--accent); border-radius: 14px; padding: 16px 16px; box-shadow: var(--shadow-sm); }
  .f-card .big { font-size: 34px; font-weight: 800; color: var(--accent-2); margin-bottom: 4px; }
  .f-card p { font-size: 19px; color: var(--muted); }

  .oc-card { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 6px 16px; box-shadow: var(--shadow-sm); text-align: left; }
  .oc-item { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line-soft); font-size: 21px; }
  .oc-item:last-child { border-bottom: 0; }
  .oc-ans { font-weight: 700; color: var(--accent-2); white-space: nowrap; }

  .sim { display: grid; grid-template-columns: 1.16fr .84fr; gap: 14px; flex: 1; min-height: 0; }
  #chart-wrap { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; justify-content: space-between; padding: 10px 12px; min-height: 0; overflow: hidden; }
  #marketChart { width: 100%; flex: 1 1 auto; min-height: 0; }
  .controls { display: flex; flex-direction: column; gap: 6px; text-align: left; min-height: 0; }
  [data-id="market-sim"] h2 { margin-bottom: 8px; }
  [data-id="market-sim"] .metric { padding: 7px 12px; }
  [data-id="market-sim"] .metric .val { font-size: 25px; }
  [data-id="market-sim"] .slider-box { padding: 7px 12px; font-size: 17px; }
  [data-id="market-sim"] input[type=range] { height: 14px; }
  [data-id="market-sim"] .ctrl-btns button { font-size: 17px; padding: 7px 12px; }
  .metric-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .metric { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
  .metric .lab { font-size: 16px; color: var(--muted); }
  .metric .val { font-size: 26px; font-weight: 800; }
  .slider-box { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 8px 13px; font-size: 18px; }
  .slider-head { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 3px; }
  input[type=range] { width: 100%; height: 18px; accent-color: var(--accent); }
  .ctrl-btns { display: flex; flex-wrap: wrap; gap: 7px; }
  .ctrl-btns button { font-size: 17px; padding: 7px 13px; }

  .pt-cards { display: flex; flex-direction: column; gap: 9px; text-align: left; }
  .pt-item { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 11px 15px; box-shadow: var(--shadow-sm); }
  .pt-item h3 { font-size: 21px; color: var(--accent-2); margin-bottom: 3px; }
  .pt-item p { font-size: 18px; color: var(--muted); }

  .hook-stage { background: var(--paper); border: 1px solid var(--line); border-top: 4px solid var(--bad); border-radius: 20px; padding: 16px 24px; box-shadow: var(--shadow); text-align: center; margin-bottom: 10px; }
  .hook-step { font-size: 17px; font-weight: 700; color: var(--muted); letter-spacing: .06em; }
  .hook-loss { font-size: 40px; font-weight: 800; margin: 4px 0 6px; color: var(--bad); }
  .hook-loss.cash { color: var(--blue); }
  .hook-text { font-size: 23px; line-height: 1.46; color: var(--ink); max-width: 1080px; margin: 0 auto; }
  .hook-duel { display: grid; grid-template-columns: 1fr 210px 1fr; gap: 14px; align-items: stretch; }
  .duel-card { border: 2px solid var(--line); border-radius: 20px; padding: 14px 18px; box-shadow: var(--shadow-sm); text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
  .duel-card.ticket { border-color: #f1b7b2; background: #fff7f6; }
  .duel-card.cash { border-color: #bfd7ea; background: #f4f9fd; }
  .duel-tag { font-size: 19px; font-weight: 800; }
  .duel-card.ticket .duel-tag, .duel-card.ticket .duel-pct { color: var(--bad); }
  .duel-card.cash .duel-tag, .duel-card.cash .duel-pct { color: var(--blue); }
  .duel-pct { font-size: 62px; font-weight: 900; line-height: 1.02; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .duel-lab { font-size: 17px; color: var(--muted); margin-bottom: 6px; }
  .duel-bar { height: 11px; background: #ece7dc; border-radius: 99px; overflow: hidden; }
  .duel-bar i { display: block; height: 100%; width: 0; border-radius: 99px; transition: width 1s cubic-bezier(.2, .8, .2, 1); }
  .ticket .duel-bar i { background: var(--bad); }
  .cash .duel-bar i { background: var(--blue); }
  .seat-svg { width: 100%; max-width: 270px; height: auto; margin: 6px auto 2px; display: block; }
  .duel-ref { margin-top: 3px; font-size: 17px; color: var(--muted); font-weight: 600; }
  .duel-mid { background: var(--paper); border: 1.5px solid var(--line); border-radius: 18px; padding: 8px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-size: 17px; color: var(--muted); line-height: 1.35; }
  .hook-bridge { margin-top: 8px; background: var(--blue-soft); border: 1.5px solid #bfd7ea; border-left: 5px solid var(--blue); border-radius: 14px; padding: 10px 16px; font-size: 20px; line-height: 1.55; text-align: left; }
  .hook-src { margin-top: 5px; font-size: 16px; color: var(--muted); text-align: right; }

  .rules { display: flex; flex-direction: column; gap: 8px; }
  .rule-row {
    display: grid; grid-template-columns: 190px 1.05fr 92px 1.2fr; align-items: center; gap: 10px;
    background: var(--paper); border: 1px solid var(--line); border-radius: 14px;
    padding: 10px 16px; box-shadow: var(--shadow-sm); text-align: left;
  }
  .rule-row.head { background: transparent; border: 0; box-shadow: none; padding: 0 16px; font-size: 16px; font-weight: 700; color: var(--muted); }
  .rule-exp { font-size: 21px; font-weight: 800; color: var(--ink); }
  .rule-exp .num { display: block; font-size: 15px; font-weight: 800; color: var(--accent); letter-spacing: .05em; }
  .rule-bias { font-size: 18px; color: var(--muted); line-height: 1.38; }
  .rule-ev { display: inline-block; margin-top: 3px; font-size: 16px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--paper-soft); border: 1px solid var(--line); color: var(--ink); }
  .rule-arrow { display: flex; align-items: center; justify-content: center; }
  .rule-do { font-size: 19px; font-weight: 700; color: var(--accent-2); background: #e8f6f1; border: 1px solid #b7e0d2; border-radius: 11px; padding: 9px 13px; line-height: 1.38; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .rule-stamp { flex-shrink: 0; font-size: 15px; font-weight: 800; color: #0f6e56; border: 1.5px solid #0f6e56; border-radius: 6px; padding: 2px 7px; letter-spacing: .03em; background: rgba(255,255,255,0.75); }

<script>
(function () {
  const slidesRoot = document.getElementById("slides");
  const tpl = document.getElementById("tpl");
  const stage = document.createElement("div");
  stage.className = "stage";
  slidesRoot.appendChild(stage);
  [...tpl.content.children].forEach((el) => stage.appendChild(el));
  const slides = [...stage.querySelectorAll(".slide")];
  let i = 0;

  function fitStage() {
    const k = Math.min(window.innerWidth / 1600, window.innerHeight / 900);
    stage.style.transform = "scale(" + k + ")";
  }
  window.addEventListener("resize", fitStage);
  fitStage();

  const topBar = document.querySelector(".bar");
  let barTimer = null;
  function wakeBar() {
    if (!topBar) return;
    topBar.classList.remove("idle");
    clearTimeout(barTimer);
    barTimer = setTimeout(() => topBar.classList.add("idle"), 3000);
  }
  document.addEventListener("mousemove", wakeBar, { passive: true });
  document.addEventListener("pointerdown", wakeBar, { passive: true });
  document.addEventListener("keydown", wakeBar);
  wakeBar();

  const dots = document.getElementById("dots");
  slides.forEach((_, idx) => {
    const b = document.createElement("button");
    b.className = "dot"; b.type = "button";
    b.addEventListener("click", () => show(idx));
    dots.appendChild(b);
  });

  function setBadge(id, active, text) {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.toggle("wait", !active);
    const sp = el.querySelector("span");
    if (sp) sp.textContent = text;
  }

  function show(n) {
    i = Math.max(0, Math.min(slides.length - 1, n));
    slides.forEach((s, k) => s.classList.toggle("on", k === i));
    [...dots.children].forEach((d, k) => d.classList.toggle("on", k === i));
    document.getElementById("pageNum").textContent = (i + 1) + " / " + slides.length;
    document.getElementById("btnPrev").disabled = i === 0;
    document.getElementById("btnNext").textContent = i === slides.length - 1 ? "回到封面" : "下一页";
    const curId = slides[i].dataset.id;
    if (curId === "hook") renderHook();
    if (curId === "guess-enter") renderGuessAxis();
    if (curId === "guess-insight") updateInsight();
    if (curId === "prospect-play" || curId === "prospect-insight") renderPT();
    if (curId === "overconf-play") renderOC();
    if (curId === "market-intro" || curId === "close") syncCrossSlideBadges();
    if (curId === "market-sim") renderChart();
    if (location.hash !== "#" + curId) {
      history.replaceState(null, "", "#" + curId);
    }
  }

  document.getElementById("btnPrev").onclick = () => show(i - 1);
  document.getElementById("btnNext").onclick = () => show(i === slides.length - 1 ? 0 : i + 1);
  document.getElementById("btnFull").onclick = toggleFull;
  function toggleFull() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
    else document.exitFullscreen().catch(() => {});
  }
  document.addEventListener("fullscreenchange", () => {
    document.getElementById("btnFull").textContent = document.fullscreenElement ? "退出全屏" : "全屏";
  });

  function typing() {
    const el = document.activeElement;
    return el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA");
  }
  document.addEventListener("keydown", (e) => {
    if (typing()) return;
    if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") {
      if (e.key === " " && slides[i].dataset.id === "market-sim") { e.preventDefault(); toggleSimPlay(); return; }
      e.preventDefault();
      if (i < slides.length - 1) show(i + 1);
    } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
      e.preventDefault();
      show(i - 1);
    } else if (e.key === "Home") show(0);
    else if (e.key === "End") show(slides.length - 1);
    else if (e.key === "f" || e.key === "F") toggleFull();
  });

  // ----- 1. 导入：心理账户 -----
  const hookScenes = [
    { step: "情景一 / 共两个", loss: "丢了 500 元门票", cls: "", text: "你提前花 500 元买了一张演唱会门票。到了检票口，发现票丢了，票不记名、无法补办。售票处还有票，<strong>你会再花 500 元买一张吗？</strong>" },
    { step: "情景二 / 共两个", loss: "丢了 500 元现金", cls: "cash", text: "你打算到现场花 500 元买演唱会门票。到了售票口，发现钱包里丢了 500 元现金。售票处还有票，<strong>你还会花 500 元买票吗？</strong>" }
  ];
  const hookVotes = [{ yes: 0, no: 0 }, { yes: 0, no: 0 }];
  let hookI = 0;

  function renderSeatGrid(svgId, yes, tot, activeColor) {
    const svg = document.getElementById(svgId);
    if (!svg) return;
    const count = tot > 0 ? Math.min(tot, 54) : 45;
    const lit = tot > 0 ? Math.round((yes / tot) * count) : 0;
    const cols = 9;
    const rows = Math.ceil(count / cols);
    const startX = 27, startY = 26, dx = 27, dy = rows > 5 ? 15 : 18;
    let out = `<rect x="55" y="3" width="160" height="13" rx="6" fill="#ece7dc"/>`;
    out += `<text x="135" y="13" text-anchor="middle" font-size="9.5" font-weight="700" fill="#52525b">人数示意 · 最多 54 点</text>`;
    for (let k = 0; k < count; k++) {
      const r = Math.floor(k / cols), c = k % cols;
      const cx = startX + c * dx, cy = startY + r * dy;
      if (k < lit) {
        out += `<circle cx="${cx}" cy="${cy}" r="6.2" fill="${activeColor}" class="pop-dot" style="animation-delay:${(k * 15)}ms;"/>`;
      } else {
        out += `<circle cx="${cx}" cy="${cy}" r="5.6" fill="#e9e4da" stroke="#cfc8ba" stroke-width="1"/>`;
      }
    }
    svg.innerHTML = out;
  }

  function renderHookLiveStrip() {
    const svg = document.getElementById("hookLiveSeats");
    if (!svg) return;
    const v = hookVotes[hookI] || { yes: 0, no: 0 };
    const tot = v.yes + v.no;
    const cap = Math.max(45, Math.min(tot, 60));
    let out = `<text x="6" y="21" font-size="12.5" font-weight="700" fill="#52525b">实时投票人数：</text>`;
    for (let k = 0; k < cap; k++) {
      const cx = 104 + k * ((508) / Math.max(1, cap - 1));
      const fill = k < v.yes ? "#0f6e56" : (k < tot ? "#b42318" : "#e4dfd5");
      out += `<circle cx="${cx.toFixed(1)}" cy="17" r="4.2" fill="${fill}"/>`;
    }
    svg.innerHTML = out;
  }

  function animateHookPct(elId, barId, target) {
    const el = document.getElementById(elId), bar = document.getElementById(barId);
    bar.style.width = "0%";
    const t0 = performance.now();
    const tick = (t) => {
      const k = Math.min(1, (t - t0) / 1100), eased = 1 - Math.pow(1 - k, 3);
      el.textContent = Math.round(target * eased) + "%";
      if (k < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(() => { bar.style.width = target + "%"; requestAnimationFrame(tick); });
  }
  function renderHook() {
    const play = document.getElementById("hookPlay");
    const result = document.getElementById("hookResult");
    const maxN = Math.max(hookVotes[0].yes + hookVotes[0].no, hookVotes[1].yes + hookVotes[1].no);
    setBadge("badgeHook", maxN > 0, maxN > 0 ? `单轮最多录入 ${maxN} 人` : "课堂实时投票待采集");
    if (hookI >= 2) {
      play.hidden = true; result.hidden = false;
      [["Ticket", 0, "#b42318"], ["Cash", 1, "#1d5d8f"]].forEach(([key, idx, col]) => {
        const v = hookVotes[idx], tot = v.yes + v.no;
        document.getElementById("n" + key).textContent = tot ? v.yes + " / " + tot + " 人" : "—";
        renderSeatGrid("dots" + key, v.yes, tot, col);
        if (tot) animateHookPct("pct" + key, "bar" + key, Math.round(v.yes / tot * 100));
        else { document.getElementById("pct" + key).textContent = "—"; document.getElementById("bar" + key).style.width = "0%"; }
      });
      return;
    }
    play.hidden = false; result.hidden = true;
    const sc = hookScenes[hookI];

  // ----- 2. 实验一：选美博弈 -----
  const nums = [];
  const numIn = document.getElementById("numIn");
  const chips = document.getElementById("chips");
  let revealed = false;

  function parseNums(text) {
    return (text || "").split(/[,，、\s]+/).map((s) => s.trim()).filter(Boolean).map((s) => Number(s)).filter((n) => Number.isInteger(n) && n >= 0 && n <= 100);
  }
  function addNums(arr) {
    arr.forEach((n) => nums.push(n));
    revealed = false;
    document.body.classList.remove("is-revealed");
    renderNums();
  }
  function fmt(n) { return Number.isInteger(n) ? String(n) : n.toFixed(1); }

  function getGuessStats() {
    if (!nums.length) return null;
    const avg = nums.reduce((a, b) => a + b, 0) / nums.length;
    const target = avg * 2 / 3;
    let best = Infinity;
    nums.forEach((x) => { best = Math.min(best, Math.abs(x - target)); });
    const winners = [...new Set(nums.filter((x) => Math.abs(x - target) - best < 1e-9))].sort((a, b) => a - b);
    return { n: nums.length, avg, target, best, winners };
  }

  function renderGuessAxis() {
    const svg = document.getElementById("guessAxisSvg");
    if (!svg) return;
    const x0 = 38, x1 = 568, yAxis = 158;
    const mx = (v) => x0 + (v / 100) * (x1 - x0);
    let h = `
      <defs>
        <marker id="arrGuess" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d5d8f"/>
        </marker>
      </defs>
      <rect x="${mx(18)}" y="22" width="${mx(36) - mx(18)}" height="${yAxis - 22}" rx="8" fill="rgba(194,87,26,0.07)"/>
      <line x1="${x0}" y1="${yAxis}" x2="${x1}" y2="${yAxis}" stroke="#52525b" stroke-width="2"/>
    `;
    [0, 20, 33.3, 50, 80, 100].forEach((tk) => {
      const tx = mx(tk);
      const lab = tk === 33.3 ? "33.3(L1)" : (tk === 50 ? "50(L0)" : String(tk));
      h += `<line x1="${tx}" y1="${yAxis}" x2="${tx}" y2="${yAxis + 6}" stroke="#52525b" stroke-width="1.5"/>`;
      h += `<text x="${tx}" y="${yAxis + 21}" text-anchor="middle" font-size="11.5" fill="#52525b">${lab}</text>`;
    });
    // Nash equilibrium pin at 0
    h += `<line x1="${x0}" y1="30" x2="${x0}" y2="${yAxis}" stroke="#1d5d8f" stroke-width="2" stroke-dasharray="4 3"/>`;
    h += `<circle cx="${x0}" cy="${yAxis}" r="5.5" fill="#1d5d8f"/>`;
    h += `<text x="${x0 + 4}" y="22" font-size="12" font-weight="800" fill="#1d5d8f">纳什均衡 0</text>`;

    if (!nums.length) {
      h += `<text x="303" y="98" text-anchor="middle" font-size="14.5" fill="#52525b">录入学生 0–100 整数报价后，实时生成个体落点与收敛靶心</text>`;
      svg.innerHTML = h;
      return;
    }
    if (!revealed) {
      h += `<text x="303" y="68" text-anchor="middle" font-size="15" font-weight="700" fill="#0f6e56">已密封收集 ${nums.length} 份学生独立报价，点击下方按钮同屏揭晓</text>`;
      const showN = Math.min(nums.length, 36);
      for (let k = 0; k < showN; k++) {
        const cx = 76 + k * (454 / Math.max(1, showN - 1));
        h += `<circle cx="${cx.toFixed(1)}" cy="106" r="6" fill="#0f6e56" opacity="0.78" class="pop-dot" style="animation-delay:${k * 12}ms;"/>`;
      }
      svg.innerHTML = h;
      return;
    }

    const st = getGuessStats();
    const stacks = {};
    nums.forEach((v, idx) => {
      const bucket = Math.round(v / 2) * 2;
      stacks[bucket] = (stacks[bucket] || 0) + 1;
      const rank = stacks[bucket] - 1;
      const cx = mx(v);
      const cy = Math.max(34, yAxis - 10 - rank * 12.5);
      const isWin = Math.abs(v - st.target) - st.best < 1e-9;
      if (isWin) {
        h += `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="7" fill="none" stroke="#0f6e56" stroke-width="2"></circle>`;
        h += `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="6.2" fill="#0f6e56" stroke="#fff" stroke-width="1.5" class="pop-dot" style="animation-delay:${idx * 16}ms;"/>`;
      } else {
        h += `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="5.2" fill="#c2571a" opacity="0.86" stroke="#fff" stroke-width="1" class="pop-dot" style="animation-delay:${idx * 16}ms;"/>`;
      }
    });

    const xAvg = mx(st.avg), xTar = mx(st.target);
    h += `<line x1="${xAvg.toFixed(1)}" y1="34" x2="${xAvg.toFixed(1)}" y2="${yAxis}" stroke="#c2571a" stroke-width="2" stroke-dasharray="5 4"/>`;
    h += `<rect x="${(xAvg - 44).toFixed(1)}" y="12" width="88" height="20" rx="6" fill="#fff8f2" stroke="#c2571a"/>`;
    h += `<text x="${xAvg.toFixed(1)}" y="26" text-anchor="middle" font-size="11.5" font-weight="800" fill="#c2571a">均值 ${fmt(st.avg)}</text>`;

    h += `<line x1="${xTar.toFixed(1)}" y1="34" x2="${xTar.toFixed(1)}" y2="${yAxis}" stroke="#0f6e56" stroke-width="2.6"/>`;
    h += `<rect x="${(xTar - 48).toFixed(1)}" y="34" width="96" height="21" rx="6" fill="#e8f6f1" stroke="#0f6e56"/>`;
    h += `<text x="${xTar.toFixed(1)}" y="49" text-anchor="middle" font-size="11.5" font-weight="800" fill="#0a4d3c">靶心 ${fmt(st.target)}</text>`;

    if (Math.abs(xAvg - xTar) > 12) {
      const midX = (xAvg + xTar) / 2;
      const arc = `M ${xAvg.toFixed(1)} 68 Q ${midX.toFixed(1)} 42 ${(xTar + 4).toFixed(1)} 64`;
      h += `<path d="${arc}" fill="none" stroke="#1d5d8f" stroke-width="2" class="flow-line" marker-end="url(#arrGuess)"/>`;
    }

    // Deviation bracket from Nash 0 to Target
    h += `<line x1="${x0}" y1="194" x2="${xTar.toFixed(1)}" y2="194" stroke="#1d5d8f" stroke-width="2"/>`;
    h += `<line x1="${x0}" y1="189" x2="${x0}" y2="199" stroke="#1d5d8f" stroke-width="2"/>`;
    h += `<line x1="${xTar.toFixed(1)}" y1="189" x2="${xTar.toFixed(1)}" y2="199" stroke="#1d5d8f" stroke-width="2"/>`;
    h += `<text x="${((x0 + xTar) / 2).toFixed(1)}" y="207" text-anchor="middle" font-size="11.5" font-weight="800" fill="#1d5d8f">偏离均衡 +${fmt(st.target)}</text>`;
    h += `<text x="${Math.min(556, xTar + 115).toFixed(1)}" y="198" font-size="12" font-weight="800" fill="#0f6e56">★ 获胜学生报价：${st.winners.join(" / ")}</text>`;

    svg.innerHTML = h;
  }

  function renderNums() {
    chips.innerHTML = "";
    const st = revealed ? getGuessStats() : null;
    nums.forEach((n, idx) => {
      const el = document.createElement("span");
      const isWin = st && Math.abs(n - st.target) - st.best < 1e-9;
      el.className = "chip" + (isWin ? " win" : "");
      const sid = "S" + String(idx + 1).padStart(2, "0");
      el.innerHTML = `<span class="sid">${sid}</span> ${n}${isWin ? " ★" : ""} <button type="button" aria-label="删除">×</button>`;
      el.querySelector("button").onclick = () => { nums.splice(idx, 1); revealed = false; document.body.classList.remove("is-revealed"); renderNums(); };
      chips.appendChild(el);
    });
    document.getElementById("countHint").textContent = nums.length ? ("已录入 " + nums.length + " 份脱敏学生报价（S01–S" + String(nums.length).padStart(2, "0") + "）") : "尚未录入。";
    document.getElementById("stN").textContent = nums.length ? String(nums.length) : "—";
    document.getElementById("btnReveal").disabled = nums.length === 0;
    setBadge("badgeGuess", nums.length > 0, nums.length > 0 ? (revealed ? `实测 ${nums.length} 份报价已揭晓` : `已录入 ${nums.length} 份密封报价`) : "待录入学生报价");
    if (revealed) showReveal();
    else {
      document.getElementById("stAvg").textContent = "—";
      document.getElementById("stTarget").textContent = "—";
      document.getElementById("stWin").textContent = "—";
      renderGuessAxis();
    }
    syncCrossSlideBadges();
  }
  function showReveal() {
    const st = getGuessStats();
    if (!st) return;
    document.getElementById("stAvg").textContent = fmt(st.avg);
    document.getElementById("stTarget").textContent = fmt(st.target);
    document.getElementById("stWin").textContent = st.winners.join("、") + "（距靶心 " + fmt(st.best) + "，纳什均衡为 0）";
    document.body.classList.add("is-revealed");
    renderGuessAxis();
    syncCrossSlideBadges();
  }
  document.getElementById("btnAdd").onclick = () => {
    const arr = parseNums(numIn.value);
    if (!arr.length) return;
    addNums(arr); numIn.value = ""; numIn.focus();
  };
  numIn.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); document.getElementById("btnAdd").click(); }

  document.getElementById("btnPaste").onclick = () => {

  function updateInsight() {
    const line = document.getElementById("insightReal");

      const c2 = nums.filter((v) => v >= 18 && v <= 27).length;
      const c3 = nums.filter((v) => v < 18).length;
      const pct12 = Math.round(((c1 + c2) / st.n) * 100);
      line.textContent = `本班 ${st.n} 人实测均值 ${fmt(st.avg)}，目标点位 ${fmt(st.target)}；其中 ${c1 + c2} 人（${pct12}%）落在 Level-1 至 Level-2 区间，显著偏离纳什均衡解 0。`;
      if (zl) zl.textContent = `本班实测集中带：${c1 + c2}/${st.n} 人（${pct12}%）落在此区间`;

        ov.innerHTML = cols.map((b) => b.cnt ? `<rect x="${b.x - 32}" y="${b.y - 20}" width="64" height="20" rx="10" fill="rgba(24,24,27,0.72)"/><text x="${b.x}" y="${b.y - 6}" text-anchor="middle" font-size="12" font-weight="700" fill="${b.col}">本班 ${b.cnt}人</text>` : "").join("");
      }
      setBadge("badgeGuessIns", true, `本班 ${st.n} 人分布已叠印（靶心 ${fmt(st.target)}）`);
    } else {
      line.textContent = "真实交易者多停留在 Level-1 至 Level-2：明知资产高估，仍博弈「下一棒接盘者」而出价高于内在价值。";
      if (zl) zl.textContent = "真实课堂集中带（Level-1 ～ Level-2）";
      if (ov) ov.innerHTML = "";
      setBadge("badgeGuessIns", false, "实测落点映射推理阶梯");
    }
  }

  }
  document.querySelectorAll(".oc-cnt-btn").forEach((btn) => {
    btn.onclick = () => { ocCounts[Number(btn.dataset.k)]++; renderOC(); };
  });
  document.getElementById("ocClear").onclick = () => { for (let k = 0; k < 5; k++) ocCounts[k] = 0; renderOC(); };

  // ----- 5. 实验四：严格对应前三项实验的 ABM 市场出清模型 -----
  const sTrend = document.getElementById("sTrend"); // 实验一：高阶信念（选美预期）主体权重
  const sLoss = document.getElementById("sLoss");   // 实验二：前景理论（处置效应）主体权重
  const sNoise = document.getElementById("sNoise"); // 实验三：过度自信倍数 k = 90% ÷ 实测命中率
  let prices = [100], refPrice = 100, beliefAnchor = 112, simTimer = null, simPlaying = false;
  let refSeries = [100], anchorSeries = [112];
  let lastForces = { beauty: 0, disp: 0, arb: 0, oc: 0 };
  // 固定随机种子：同一参数下每次演示路径一致
  const SIM_SEED = 20261116;
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  let simRng = mulberry32(SIM_SEED);
  const resetRng = () => { simRng = mulberry32(SIM_SEED); };
  // 权重归一：高阶信念 + 处置效应 ≤ 90%，余量为基本面套利主体
  const BEHAVIOR_CAP = 90;
  function balanceWeights(moved, other) {
    const over = Number(sTrend.value) + Number(sLoss.value) - BEHAVIOR_CAP;
    if (over > 0) other.value = Math.max(0, Number(other.value) - over);
    if (Number(moved.value) + Number(other.value) > BEHAVIOR_CAP) moved.value = BEHAVIOR_CAP - Number(other.value);
  }

  function syncCrossSlideBadges() {
    const st = revealed ? getGuessStats() : null;
    const totG = ptVotes[0].a + ptVotes[0].b, totL = ptVotes[1].a + ptVotes[1].b;
    const pctSafe = totG ? (ptVotes[0].a / totG) * 100 : 0;
    const pctGamble = totL ? (ptVotes[1].b / totL) * 100 : 0;
    let ocTot = 0, ocHits = 0;
    ocCounts.forEach((c, k) => { ocTot += c; ocHits += c * k; });
    const ocRate = ocTot ? (ocHits / (ocTot * 4)) * 100 : 0;
    const arbPct = 100 - Number(sTrend.value) - Number(sLoss.value);

    const m1 = document.getElementById("mapSub1");
    const m2 = document.getElementById("mapSub2");
    const m3 = document.getElementById("mapSub3");
    if (m1) m1.textContent = st ? `本班靶心 ${fmt(st.target)}（高于均衡 0）→ 追逐共识预期` : "按群体共识情绪预期（Level-k）报价";
    if (m2) m2.textContent = totL ? `本班亏损域 ${pctGamble.toFixed(1)}% 冒险持有 → 惜售与破位平仓` : "锚定建仓参考点：浮盈早兑现、浮亏惜售";
    if (m3) m3.textContent = ocRate > 0 ? `本班命中率 ${ocRate.toFixed(1)}%（k ≈ ${(90 / ocRate).toFixed(1)}×）→ 放大扰动` : "置信区间过窄，高估信号并放大波动";

    const e1 = document.getElementById("closeEv1");
    const e2 = document.getElementById("closeEv2");
    const e3 = document.getElementById("closeEv3");
    const e4 = document.getElementById("closeEv4");
    if (e1) e1.textContent = st ? `本班实测：${st.n} 人均值 ${fmt(st.avg)}，目标 ${fmt(st.target)} vs 均衡 0` : "对照纳什均衡解 0";
    if (e2) e2.textContent = (totG && totL) ? `收益选确定 ${pctSafe.toFixed(1)}% ｜ 亏损选风险 ${pctGamble.toFixed(1)}%` : "对照期望值一致性基准";
    if (e3) e3.textContent = ocRate > 0 ? `本班实测：区间命中率 ${ocRate.toFixed(1)}%（k ≈ ${(90 / ocRate).toFixed(1)}×）` : "对照 90% 贝叶斯校准基准";
    if (e4) e4.textContent = prices.length > 1 ? `沙盘实测：套利权重 ${arbPct}%，当前出清价 ${prices[prices.length - 1].toFixed(1)}` : "对照有效市场价格 V=100";
  }

  function stepMarket(shock = 0) {
    const bW = Number(sTrend.value) / 100; // 高阶信念权重
    const dW = Number(sLoss.value) / 100;  // 处置效应权重
    const rW = 1 - bW - dW;                 // 基本面套利权重（三类主体权重合计 100%）
    const oc = Number(sNoise.value);       // 过度自信倍数 k（k = 1 为校准良好）
    const p = prices[prices.length - 1];

    // 1. 实验一机制：群体高阶信念共识锚（Level-k 猜测他人预期，脱离 V=100 自我强化，遇冲击时共识坍塌）
    if (shock < 0) beliefAnchor = 78;
    else beliefAnchor = Math.max(72, Math.min(165, 100 + 0.92 * (beliefAnchor - 100) + 0.18 * (p - 100)));
    const beautyDemand = bW * 0.32 * (beliefAnchor - p);

    // 2. 实验二机制：前景理论参考点（p > refPrice 浮盈兑现产生抛压；p < refPrice 浅跌惜售阻尼，跌破深水区被动清盘）
    refPrice = 0.85 * refPrice + 0.15 * p;
    let dispDemand = 0;
    if (p > refPrice) dispDemand = -dW * 0.22 * (p - refPrice); // 收益域凹函数：过早止盈抛压
    else if (p > refPrice - 14) dispDemand = dW * 0.25 * (refPrice - p); // 亏损域凸函数：惜售护盘/补仓
    else dispDemand = -dW * 4.2; // 击穿承受底线引发被动连锁平仓

    // 3. 实验三机制：过度自信高估私有信号精度，放大短期交易扰动
    const ocShock = (simRng() - 0.5) * oc * 3.8; // 每步随机扰动 ±1.9k

    // 4. 有效市场基准力量：基本面套利者围绕 V=100 反向修正
    const arbDemand = rW * 0.34 * (100 - p);

    lastForces = { beauty: beautyDemand, disp: dispDemand, arb: arbDemand, oc: ocShock };
    prices.push(Math.max(35, Math.min(200, p + arbDemand + beautyDemand + dispDemand + ocShock + shock)));
    refSeries.push(refPrice);
    anchorSeries.push(beliefAnchor);
    if (prices.length > 60) { prices.shift(); refSeries.shift(); anchorSeries.shift(); }
    renderChart();
  }

  function renderChart() {
    document.getElementById("vTrend").textContent = sTrend.value + "%";
    document.getElementById("vLoss").textContent = sLoss.value + "%";
    document.getElementById("vNoise").textContent = Number(sNoise.value).toFixed(1) + "×";
    updateKHint();
    const arbPct = 100 - Number(sTrend.value) - Number(sLoss.value);
    document.getElementById("vArb").textContent = arbPct + "%";
    document.getElementById("arbBar").style.width = arbPct + "%";
    const svg = document.getElementById("marketChart");
    const W = 800, H = 300, padL = 52, padR = 24, padT = 16, padB = 22, minY = 30, maxY = 210;
    const mapX = (idx) => padL + (idx / Math.max(1, prices.length - 1)) * (W - padL - padR);
    const mapY = (val) => padT + (1 - (val - minY) / (maxY - minY)) * (H - padT - padB);
    const baseY = mapY(100);

    let html = `
      <defs>
        <clipPath id="clipAbove"><rect x="${padL}" y="0" width="${W - padL - padR}" height="${baseY.toFixed(1)}"/></clipPath>
        <clipPath id="clipBelow"><rect x="${padL}" y="${baseY.toFixed(1)}" width="${W - padL - padR}" height="${(H - baseY).toFixed(1)}"/></clipPath>
      </defs>
    `;
    [60, 100, 140, 180].forEach((gv) => {
      const gy = mapY(gv);
      const isBase = gv === 100;
      html += `<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${W - padR}" y2="${gy.toFixed(1)}" stroke="${isBase ? "#52525b" : "#ebe6dc"}" stroke-width="${isBase ? 2 : 1}" ${isBase ? 'stroke-dasharray="8 6"' : ""}/>`;
      html += `<text x="${padL - 8}" y="${(gy + 5).toFixed(1)}" text-anchor="end" font-size="${isBase ? 15 : 12.5}" font-weight="${isBase ? 700 : 500}" fill="#52525b">${gv}</text>`;
    });

    if (prices.length > 1) {
      const pts = prices.map((v, idx) => `${mapX(idx).toFixed(1)},${mapY(v).toFixed(1)}`).join(" ");
      const lastX = mapX(prices.length - 1).toFixed(1);
      const polyArea = `${padL},${baseY.toFixed(1)} ${pts} ${lastX},${baseY.toFixed(1)}`;
      html += `<polygon points="${polyArea}" fill="rgba(194,87,26,0.16)" clip-path="url(#clipAbove)"/>`;
      html += `<polygon points="${polyArea}" fill="rgba(180,35,24,0.15)" clip-path="url(#clipBelow)"/>`;

      if (anchorSeries.length === prices.length) {
        const aPts = anchorSeries.map((v, idx) => `${mapX(idx).toFixed(1)},${mapY(v).toFixed(1)}`).join(" ");
        html += `<polyline fill="none" stroke="#c2571a" stroke-width="1.8" stroke-dasharray="3 4" opacity="0.72" points="${aPts}" />`;
      }
      if (refSeries.length === prices.length) {
        const rPts = refSeries.map((v, idx) => `${mapX(idx).toFixed(1)},${mapY(v).toFixed(1)}`).join(" ");
        html += `<polyline fill="none" stroke="#8b8375" stroke-width="1.8" stroke-dasharray="6 4" opacity="0.72" points="${rPts}" />`;
      }
      // Distress threshold line for latest refPrice - 14
      const stopY = mapY(Math.max(minY, refPrice - 14));
      html += `<line x1="${padL}" y1="${stopY.toFixed(1)}" x2="${W - padR}" y2="${stopY.toFixed(1)}" stroke="#b42318" stroke-width="1.2" stroke-dasharray="3 5" opacity="0.55"/>`;
      html += `<text x="${padL + 8}" y="${(stopY + 13).toFixed(1)}" font-size="11.5" font-weight="600" fill="#b42318" opacity="0.85">处置破位平仓线 (${(refPrice - 14).toFixed(0)})</text>`;

      html += `<polyline fill="none" stroke="#0f6e56" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" points="${pts}" />`;
    }

    const last = prices[prices.length - 1];
    const lx = prices.length === 1 ? padL : mapX(prices.length - 1);
    const ly = mapY(last);
    const dotCol = last >= 100 ? "#c2571a" : "#b42318";
    html += `<circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="7" fill="none" stroke="${dotCol}" stroke-width="2"><animate attributeName="r" values="7;17" dur="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.85;0" dur="1.5s" repeatCount="indefinite"/></circle>`;
    html += `<circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="6.5" fill="${dotCol}" stroke="#fff" stroke-width="1.5"/>`;
    const tagX = lx > W - 118 ? lx - 84 : lx + 10;
    const tagY = Math.max(22, Math.min(H - 28, ly - 12));
    html += `<rect x="${tagX.toFixed(1)}" y="${(tagY - 14).toFixed(1)}" width="74" height="22" rx="6" fill="#fff" stroke="${dotCol}" stroke-width="1.4"/>`;
    html += `<text x="${(tagX + 37).toFixed(1)}" y="${(tagY + 1).toFixed(1)}" text-anchor="middle" font-size="12.5" font-weight="800" fill="${dotCol}">P=${last.toFixed(1)}</text>`;
    svg.innerHTML = html;

    // Render live 3-agent tug-of-war force meter
    const fSvg = document.getElementById("forceChart");
    if (fSvg) {
      const items = [
        { name: "选美高阶信念力", v: lastForces.beauty, posCol: "#c2571a", negCol: "#b42318" },
        { name: "前景处置效应力", v: lastForces.disp, posCol: "#8b8375", negCol: "#b42318" },
        { name: "基本面套利纠偏", v: lastForces.arb, posCol: "#0f6e56", negCol: "#0f6e56" }
      ];
      let fh = `<text x="6" y="15" font-size="12" font-weight="800" fill="#52525b">当期主体净申报推动力（左负抛压 ← 0 → 右正买盘）：</text>`;
      items.forEach((it, idx) => {
        const boxX = 6 + idx * 264, mid = boxX + 130;
        const mag = Math.min(82, Math.abs(it.v) * 14);
        const bx = it.v >= 0 ? mid : mid - mag;
        const col = it.v >= 0 ? it.posCol : it.negCol;
        fh += `<rect x="${boxX}" y="24" width="256" height="44" rx="9" fill="#faf8f4" stroke="#e4dfd5"/>`;
        fh += `<text x="${boxX + 10}" y="41" font-size="11.5" font-weight="700" fill="#18181b">${it.name}</text>`;
        fh += `<text x="${boxX + 246}" y="41" text-anchor="end" font-size="11.5" font-weight="800" fill="${col}">${(it.v >= 0 ? "+" : "") + it.v.toFixed(2)}</text>`;
        fh += `<line x1="${boxX + 42}" y1="56" x2="${boxX + 218}" y2="56" stroke="#ded8cc" stroke-width="6" stroke-linecap="round"/>`;
        fh += `<rect x="${bx.toFixed(1)}" y="52" width="${Math.max(2, mag).toFixed(1)}" height="8" rx="4" fill="${col}"/>`;
        fh += `<line x1="${mid}" y1="48" x2="${mid}" y2="64" stroke="#52525b" stroke-width="1.6"/>`;
      });
      fSvg.innerHTML = fh;
    }

    document.getElementById("mPrice").textContent = last.toFixed(1);
    const dev = ((last - 100) / 100) * 100;
    document.getElementById("mDev").textContent = (dev >= 0 ? "+" : "") + dev.toFixed(1) + "%";
    const recent = prices.slice(-11);
    const vol = recent.length > 1 ? recent.slice(1).reduce((a, x, i) => a + Math.abs(x - recent[i]), 0) / (recent.length - 1) : null;
    document.getElementById("mVol").textContent = vol === null ? "—" : vol.toFixed(1);
    document.getElementById("simRound").textContent = "第 " + (prices.length - 1) + " 轮";
    syncCrossSlideBadges();
  }

  function toggleSimPlay(force) {
    simPlaying = typeof force === "boolean" ? force : !simPlaying;
    document.getElementById("simPlay").textContent = simPlaying ? "暂停" : "自动演化";
    if (simTimer) { clearInterval(simTimer); simTimer = null; }
    if (simPlaying) simTimer = setInterval(() => stepMarket(0), 320);
  }
  sTrend.oninput = () => { balanceWeights(sTrend, sLoss); renderChart(); };
  sLoss.oninput = () => { balanceWeights(sLoss, sTrend); renderChart(); };
  sNoise.oninput = renderChart;
  function updateKHint() {
    let tot = 0, hits = 0;
    ocCounts.forEach((c, k) => { tot += c; hits += c * k; });
    const rate = tot ? hits / (tot * 4) * 100 : 0;
    document.getElementById("kHint").textContent = rate > 0
      ? "k = 1 为校准良好；本班实测：90% ÷ " + rate.toFixed(1) + "% ≈ " + (90 / rate).toFixed(2)
      : "k = 1 为校准良好；k 越大，区间越窄、交易扰动越大";
  }
  document.getElementById("simPlay").onclick = () => toggleSimPlay();
  document.getElementById("simStep").onclick = () => { toggleSimPlay(false); stepMarket(0); };
  const simGuide = document.getElementById("simGuide");
  function setGuide(color, bg, badge, title, desc) {
    simGuide.style.borderLeftColor = color;
    simGuide.style.background = bg;
    simGuide.innerHTML =
      '<div style="font-size:21px;font-weight:800;color:' + color + ';display:flex;align-items:center;gap:10px;">' +
        '<span class="tag-ai" style="background:' + color + ';font-size:16px;padding:4px 12px;margin:0;">' + badge + '</span>' +
        '<span>' + title + '</span>' +
      '</div>' +
      '<div style="font-size:19.5px;line-height:1.55;color:var(--ink);">' + desc + '</div>';
  }
  function resetGuide() {
    setGuide("var(--blue)", "#eef5fb", "演示指引", "核心检验：个体偏差能否撼动市场定价？",
      "• 点击<strong>「场景 A」</strong>：验证套利主导下价格紧贴 <strong>V=100</strong> 收敛<br>• 点击<strong>「场景 B」</strong>：验证高阶信念泡沫与破位连锁下跌");
  }
  document.getElementById("simShock").onclick = () => {
    stepMarket(-14);
    setGuide("var(--bad)", "#fdecec", "冲击响应", "共识情绪坍塌与被动连锁下跌",
      "高阶信念预期下调；继续观察价格与<strong>亏损承受底线</strong>的关系。若跌破底线，模型中的处置效应主体将转为被动平仓。");
  };
  document.getElementById("simReset").onclick = () => {
    toggleSimPlay(false); resetRng();
    prices = [100]; refPrice = 100; beliefAnchor = 112;
    refSeries = [100]; anchorSeries = [112]; lastForces = { beauty: 0, disp: 0, arb: 0, oc: 0 };
    renderChart();
    resetGuide();
  };
  document.getElementById("simPresetEMH").onclick = () => {
    toggleSimPlay(false);
    sTrend.value = 10; sLoss.value = 10; sNoise.value = 1;
    resetRng(); prices = [100]; refPrice = 100; beliefAnchor = 104;
    refSeries = [100]; anchorSeries = [104];
    for (let k = 0; k < 20; k++) stepMarket(0);
    setGuide("var(--accent-2)", "#e8f6f1", "场景 A", "基本面套利主导（有效市场基准）",
      "三类行为偏差降至低位（过度自信 k = 1，校准良好），套利资金迅速抵消随机扰动，市场出清价格始终紧贴内在价值 <strong>V=100</strong> 平稳收敛。");
    toggleSimPlay(true);
  };
  document.getElementById("simPresetBeh").onclick = () => {
    toggleSimPlay(false);
    sTrend.value = 55; sLoss.value = 35; sNoise.value = 2;
    resetRng(); prices = [100]; refPrice = 100; beliefAnchor = 128;
    refSeries = [100]; anchorSeries = [128];
    for (let k = 0; k < 12; k++) stepMarket(0);
    setGuide("var(--orange)", "#fff8f2", "场景 B", "三类行为偏差共同作用（内生泡沫）",
      "预设高阶信念（55%）、处置效应（35%）与过度自信（k = 2），套利仅余 10%，观察价格如何偏离 <strong>V=100</strong>。");
    toggleSimPlay(true);
  };

  // ----- 评委演示一键填充样本（均值 30.9，目标 20.6，获胜 21） -----
  let demoLoaded = false;
  document.getElementById("btnDemo").onclick = () => {
    if (!demoLoaded) {
      document.body.classList.add("demo-mode");
      hookVotes[0] = { yes: 20, no: 25 };
      hookVotes[1] = { yes: 39, no: 6 };
      hookI = 2; renderHook();
      nums.splice(0, nums.length, 50, 45, 33, 33, 35, 25, 22, 22, 20, 40, 38, 30, 28, 18, 15, 50, 33, 25, 22, 32, 34, 42, 19, 27, 36, 48, 29, 21, 24, 31);
      revealed = true; renderNums(); updateInsight();
      ptVotes[0] = { a: 36, b: 9 };
      ptVotes[1] = { a: 11, b: 34 };
      renderPT();
      Object.keys(ocAnswers).forEach((k) => { document.getElementById("ocAns" + k).textContent = ocAnswers[k]; });
      [5, 14, 16, 7, 3].forEach((c, idx) => { ocCounts[idx] = c; });
      renderOC();
      sTrend.value = 55; sLoss.value = 35; sNoise.value = 2; resetRng();
      prices = [100, 102.4, 105.8, 111.2, 118.5, 127.0, 134.6, 141.2, 136.5, 128.0, 116.4, 103.2, 92.5, 84.0, 79.5];
      refSeries = [100]; anchorSeries = [124];
      let rTmp = 100, aTmp = 124;
      for (let idx = 1; idx < prices.length; idx++) {
        rTmp = 0.85 * rTmp + 0.15 * prices[idx];
        aTmp = idx < 8 ? Math.min(148, 100 + 0.92 * (aTmp - 100) + 0.18 * (prices[idx] - 100)) : 78;
        refSeries.push(rTmp);
        anchorSeries.push(aTmp);
      }
      refPrice = rTmp; beliefAnchor = aTmp;
      lastForces = { beauty: 0.55 * 0.32 * (aTmp - 79.5), disp: -0.35 * 4.2, arb: 0.10 * 0.34 * (100 - 79.5), oc: -0.8 };
      renderChart();
      demoLoaded = true;
      document.getElementById("btnDemo").textContent = "清空演示样本";
    } else {
      document.body.classList.remove("demo-mode");
      hookVotes[0] = { yes: 0, no: 0 }; hookVotes[1] = { yes: 0, no: 0 }; hookI = 0; renderHook();
      nums.splice(0, nums.length); revealed = false; document.body.classList.remove("is-revealed"); renderNums(); updateInsight();
      ptVotes[0] = { a: 0, b: 0 }; ptVotes[1] = { a: 0, b: 0 }; renderPT();
      Object.keys(ocAnswers).forEach((k) => { document.getElementById("ocAns" + k).textContent = "待揭晓"; });
      for (let k = 0; k < 5; k++) ocCounts[k] = 0; renderOC();
      toggleSimPlay(false); resetRng(); sTrend.value = 35; sLoss.value = 35; sNoise.value = 2;
      prices = [100]; refPrice = 100; beliefAnchor = 112;
      refSeries = [100]; anchorSeries = [112]; lastForces = { beauty: 0, disp: 0, arb: 0, oc: 0 };
      renderChart();
      demoLoaded = false;
      document.getElementById("btnDemo").textContent = "评委演示";
    }
  };

  renderNums();
  renderPT();
  renderOC();
  renderChart();

  const startHash = location.hash.replace(/^#/, "");
  const start = slides.findIndex((s) => s.dataset.id === startHash);
  show(start >= 0 ? start : 0);
})();
</script>
</body>
</html>
