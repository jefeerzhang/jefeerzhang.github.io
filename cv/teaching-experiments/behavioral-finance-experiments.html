<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>《投资学原理》行为投资课堂实验教学 — 张剑</title>
<style>
  :root {
    --bg: #f6f3ec;
    --bg-grad: radial-gradient(circle at 12% 14%, rgba(15, 110, 86, 0.08), transparent 42%),
               radial-gradient(circle at 88% 82%, rgba(29, 93, 143, 0.09), transparent 45%);
    --ink: #18181b;
    --muted: #52525b;
    --paper: #ffffff;
    --paper-soft: #faf8f4;
    --line: #e4dfd5;
    --accent: #0f6e56;
    --accent-2: #0a4d3c;
    --blue: #1d5d8f;
    --blue-soft: #eef5fb;
    --orange: #c2571a;
    --bad: #b42318;
    --shadow: 0 14px 36px rgba(24, 24, 27, 0.06);
    --shadow-sm: 0 4px 14px rgba(24, 24, 27, 0.05);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    background-image: var(--bg-grad);
    color: var(--ink);
    font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    overflow: hidden;
  }
  #app { height: 100%; display: flex; flex-direction: column; position: relative; }
  .slides { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; }

  .slide {
    position: absolute;
    inset: 10px 20px 68px;
    max-width: 1840px;
    margin: 0 auto;
    display: none;
    flex-direction: column;
    justify-content: center;
    overflow-y: auto;
    padding: 6px 12px;
  }
  .slide.on { display: flex; animation: fadeIn .22s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes dashFlow { from { stroke-dashoffset: 28; } to { stroke-dashoffset: 0; } }
  @keyframes hubPulse {
    0%, 100% { filter: drop-shadow(0 0 0 rgba(29, 93, 143, 0)); }
    50% { filter: drop-shadow(0 0 10px rgba(29, 93, 143, 0.22)); }
  }
  .flow-line {
    stroke-dasharray: 8 6;
    animation: dashFlow 1.1s linear infinite;
  }
  .hub-glow { animation: hubPulse 2.6s ease-in-out infinite; }

  .slide-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
  }
  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(15, 110, 86, 0.1);
    color: var(--accent-2);
    font-size: 17px; font-weight: 700; letter-spacing: .05em;
    padding: 5px 14px; border-radius: 999px;
  }
  .pill.blue { background: var(--blue-soft); color: var(--blue); }
  .slide-sub-tag { font-size: 17px; color: var(--muted); font-weight: 500; }

  h1 { font-size: 54px; font-weight: 800; letter-spacing: -.01em; line-height: 1.18; color: var(--ink); }
  h2 { font-size: 38px; font-weight: 700; line-height: 1.25; margin-bottom: 14px; color: var(--ink); text-align: left; }
  .lead { font-size: 24px; line-height: 1.48; color: var(--muted); }
  .body { font-size: 22px; line-height: 1.48; color: var(--ink); }

  /* 封面双栏 */
  .cover-grid {
    display: grid;
    grid-template-columns: 1.22fr 0.78fr;
    gap: 28px;
    align-items: stretch;
    height: 100%;
    max-height: 920px;
  }
  .cover-left {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 26px;
    padding: 34px 38px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    text-align: left;
  }
  .cover-badge {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: .08em;
    padding: 6px 16px;
    border-radius: 999px;
    margin-bottom: 16px;
  }
  .cover-title-sub { margin-top: 10px; font-size: 22px; color: var(--muted); font-weight: 500; }
  .agent-highlights { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 20px 0; }
  .ah-card {
    background: var(--blue-soft);
    border: 1px solid #c9dff0;
    border-radius: 16px;
    padding: 14px 15px;
  }
  .ah-card .ah-num { font-size: 13px; font-weight: 800; color: var(--blue); letter-spacing: .06em; text-transform: uppercase; }
  .ah-card h4 { font-size: 19px; font-weight: 700; color: var(--ink); margin: 4px 0; }
  .ah-card p { font-size: 15px; color: var(--muted); line-height: 1.4; }

  .author-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 16px; border-top: 1px solid var(--line);
  }
  .author-name { font-size: 22px; font-weight: 700; color: var(--ink); }

  .cover-right {
    background: linear-gradient(160deg, #0d4b3c 0%, #143d59 100%);
    border-radius: 26px;
    padding: 26px;
    color: #fff;
    box-shadow: var(--shadow);
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .cover-right-head { font-size: 17px; font-weight: 700; letter-spacing: .08em; color: #a7f3d0; }
  .cover-right-foot {
    background: rgba(255,255,255,0.09);
    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 14px;
    padding: 12px 15px;
    font-size: 15px; line-height: 1.45; color: #e4e4e7; text-align: left;
  }

  /* 课程全局坐标条 */
  .course-chain {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 12px;
  }
  .cc-node {
    background: var(--paper); border: 1px solid var(--line); border-radius: 14px;
    padding: 10px 14px; text-align: left; font-size: 16px; color: var(--muted);
  }
  .cc-node strong { display: block; font-size: 18px; color: var(--ink); margin-bottom: 2px; }
  .cc-node.active {
    background: #e8f6f1; border: 2px solid var(--accent); color: var(--accent-2);
  }
  .cc-node.active strong { color: var(--accent-2); }

  .svg-card {
    background: var(--paper); border: 1px solid var(--line); border-radius: 20px;
    padding: 14px 20px; box-shadow: var(--shadow);
    display: flex; align-items: center; justify-content: center;
  }
  .svg-card svg { width: 100%; height: auto; display: block; }

  .agent-box {
    margin-top: 12px; background: var(--blue-soft); border: 1.5px solid #bfd7ea;
    border-radius: 16px; padding: 12px 18px; text-align: left; font-size: 20px; line-height: 1.48;
  }
  .tag-ai {
    display: inline-block; background: var(--blue); color: #fff;
    font-size: 15px; font-weight: 700; padding: 3px 10px; border-radius: 999px;
    margin-right: 8px; vertical-align: middle;
  }

  button {
    font: inherit; cursor: pointer; border: 0;
    background: var(--accent); color: #fff;
    border-radius: 12px; padding: 9px 18px;
    font-size: 19px; font-weight: 600;
    transition: transform .12s, box-shadow .12s;
  }
  button:hover:not(:disabled) { transform: translateY(-1px); box-shadow: var(--shadow-sm); }
  button.secondary { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  button:disabled { opacity: .45; cursor: default; }

  .bar {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 10px;
    height: 50px; min-width: min(94vw, 960px);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px;
    background: rgba(255, 255, 255, .92);
    border: 1px solid var(--line); border-radius: 999px;
    box-shadow: 0 8px 28px rgba(24, 24, 27, 0.1);
    backdrop-filter: blur(10px); z-index: 30;
  }
  .bar button { font-size: 15px; padding: 7px 14px; border-radius: 999px; }
  .dots { display: flex; gap: 7px; align-items: center; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #d4d4d8; border: 0; padding: 0; }
  .dot.on { background: var(--accent); transform: scale(1.25); }
  .bar .nav { display: flex; gap: 8px; align-items: center; }
  .page-num { font-size: 15px; color: var(--muted); min-width: 64px; text-align: center; font-weight: 600; }

  .entry { display: grid; grid-template-columns: 1.12fr .88fr; gap: 20px; flex: 1; min-height: 0; }
  .panel {
    background: var(--paper); border: 1px solid var(--line); border-radius: 20px;
    padding: 18px 22px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 10px; min-height: 0; text-align: left;
  }
  .input-row { display: flex; gap: 10px; align-items: stretch; }
  .input-row input { flex: 1; min-width: 0; }
  input[type=text], textarea {
    font: inherit; font-size: 21px; border: 1px solid var(--line); border-radius: 12px;
    padding: 8px 14px; background: var(--paper-soft); color: var(--ink); width: 100%; text-align: left;
  }
  textarea { min-height: 64px; resize: none; }
  .chips { flex: 1; overflow: auto; display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; }
  .chip { background: #efe8db; border-radius: 999px; padding: 4px 12px; font-size: 19px; display: inline-flex; gap: 6px; align-items: center; }
  .chip button { background: transparent; color: var(--muted); padding: 0; font-size: 18px; line-height: 1; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { background: var(--paper-soft); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; }
  .stat .lab { font-size: 16px; color: var(--muted); }
  .stat .val { font-size: 32px; font-weight: 700; margin-top: 2px; }
  .stat.wide { grid-column: 1 / -1; }
  .winners { font-size: 22px; font-weight: 700; color: var(--accent-2); }
  .hidden-until.reveal-on { display: none; }
  body.is-revealed .hidden-until.reveal-on { display: block; }
  .hint { font-size: 17px; color: var(--muted); }

  .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
  .scenario {
    background: var(--paper); border: 1px solid var(--line); border-radius: 18px;
    padding: 18px 22px; box-shadow: var(--shadow); font-size: 22px; line-height: 1.48;
    margin-bottom: 10px; text-align: left;
  }
  .votes { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin: 8px 0; }
  .vote {
    min-width: 230px; background: var(--paper); color: var(--ink); border: 2px solid var(--line);
    border-radius: 18px; padding: 12px 20px; font-size: 21px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .vote .cnt { font-size: 40px; font-weight: 800; line-height: 1.1; color: var(--accent); }
  .compare2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 4px; }
  .grid-2col { display: grid; grid-template-columns: 1.15fr .85fr; gap: 20px; align-items: center; }

  .roadmap { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 4px; }
  .road {
    background: var(--paper); border: 1px solid var(--line); border-radius: 18px;
    padding: 15px 18px; box-shadow: var(--shadow); text-align: left; border-top: 4px solid var(--accent);
  }
  .road .num { color: var(--accent); font-weight: 800; font-size: 15px; letter-spacing: .06em; }
  .road h3 { font-size: 23px; margin: 4px 0; }
  .road p { font-size: 17px; color: var(--muted); line-height: 1.38; }

  .formula-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 12px 0; }
  .f-card { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 20px 18px; box-shadow: var(--shadow); }
  .f-card .big { font-size: 34px; font-weight: 800; color: var(--accent-2); margin-bottom: 6px; }
  .f-card p { font-size: 19px; color: var(--muted); }

  .oc-card { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 10px 20px; box-shadow: var(--shadow); text-align: left; }
  .oc-item { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 20px; }
  .oc-item:last-child { border-bottom: 0; }
  .oc-ans { font-weight: 700; color: var(--accent-2); }

  .sim { display: grid; grid-template-columns: 1.18fr .82fr; gap: 20px; flex: 1; min-height: 0; }
  #chart-wrap { background: var(--paper); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); display: flex; flex-direction: column; padding: 14px; min-height: 0; }
  #marketChart { width: 100%; height: 100%; min-height: 310px; }
  .controls { display: flex; flex-direction: column; gap: 9px; text-align: left; }
  .metric-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .metric { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 9px 14px; }
  .metric .lab { font-size: 15px; color: var(--muted); }
  .metric .val { font-size: 26px; font-weight: 800; }
  .slider-box { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 9px 14px; font-size: 18px; }
  .slider-head { display: flex; justify-content: space-between; margin-bottom: 3px; }
  input[type=range] { width: 100%; height: 20px; accent-color: var(--accent); }
  .ctrl-btns { display: flex; flex-wrap: wrap; gap: 8px; }
  .ctrl-btns button { font-size: 17px; padding: 8px 14px; }

  .pt-cards { display: flex; flex-direction: column; gap: 11px; text-align: left; }
  .pt-item { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 13px 18px; box-shadow: var(--shadow); }
  .pt-item h3 { font-size: 21px; color: var(--accent-2); margin-bottom: 3px; }
  .pt-item p { font-size: 18px; color: var(--muted); }

  .hook-stage { background: var(--paper); border: 1px solid var(--line); border-radius: 22px; padding: 26px 32px; box-shadow: var(--shadow); text-align: center; margin-bottom: 12px; }
  .hook-step { font-size: 17px; font-weight: 700; color: var(--muted); letter-spacing: .08em; }
  .hook-loss { font-size: 46px; font-weight: 800; margin: 8px 0 10px; color: var(--bad); }
  .hook-loss.cash { color: var(--blue); }
  .hook-text { font-size: 23px; line-height: 1.55; color: var(--ink); max-width: 1100px; margin: 0 auto; }
  .hook-duel { display: grid; grid-template-columns: 1fr 180px 1fr; gap: 18px; align-items: stretch; }
  .duel-card { border: 2px solid var(--line); border-radius: 22px; padding: 20px 26px; box-shadow: var(--shadow); text-align: center; }
  .duel-card.ticket { border-color: #f1b7b2; background: #fff7f6; }
  .duel-card.cash { border-color: #bfd7ea; background: #f4f9fd; }
  .duel-tag { font-size: 20px; font-weight: 800; }
  .duel-card.ticket .duel-tag, .duel-card.ticket .duel-pct { color: var(--bad); }
  .duel-card.cash .duel-tag, .duel-card.cash .duel-pct { color: var(--blue); }
  .duel-pct { font-size: 84px; font-weight: 900; line-height: 1.05; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .duel-lab { font-size: 19px; color: var(--muted); margin-bottom: 10px; }
  .duel-bar { height: 16px; background: #ece7dc; border-radius: 99px; overflow: hidden; }
  .duel-bar i { display: block; height: 100%; width: 0; border-radius: 99px; transition: width 1.2s cubic-bezier(.2, .8, .2, 1); }
  .ticket .duel-bar i { background: var(--bad); }
  .cash .duel-bar i { background: var(--blue); }
  .duel-ref { margin-top: 10px; font-size: 17px; color: var(--muted); }
  .duel-mid { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-size: 19px; color: var(--muted); line-height: 1.4; }
  .duel-mid .eq { font-size: 72px; font-weight: 900; color: var(--ink); line-height: 1; }
  .duel-mid strong { font-size: 30px; color: var(--ink); }
  .hook-bridge { margin-top: 14px; background: var(--blue-soft); border: 1.5px solid #bfd7ea; border-radius: 16px; padding: 14px 20px; font-size: 21px; line-height: 1.7; text-align: left; }
  .hook-src { margin-top: 8px; font-size: 14px; color: var(--muted); text-align: right; }

  .rules { display: flex; flex-direction: column; gap: 12px; }
  .rule-row {
    display: grid; grid-template-columns: 200px 1fr 40px 1.15fr; align-items: center; gap: 14px;
    background: var(--paper); border: 1px solid var(--line); border-radius: 16px;
    padding: 14px 20px; box-shadow: var(--shadow-sm); text-align: left;
  }
  .rule-row.head { background: transparent; border: 0; box-shadow: none; padding: 0 20px; font-size: 16px; font-weight: 700; color: var(--muted); }
  .rule-exp { font-size: 22px; font-weight: 800; color: var(--ink); }
  .rule-exp .num { display: block; font-size: 14px; font-weight: 800; color: var(--accent); letter-spacing: .06em; }
  .rule-bias { font-size: 19px; color: var(--muted); line-height: 1.42; }
  .rule-arrow { font-size: 26px; color: var(--accent); font-weight: 800; text-align: center; }
  .rule-do { font-size: 20px; font-weight: 700; color: var(--accent-2); background: #e8f6f1; border-radius: 12px; padding: 10px 14px; line-height: 1.42; }

  @media (min-width: 1520px) and (min-height: 840px) {
    .slide { inset: 12px 24px 70px; padding: 8px 14px; }
    h1 { font-size: clamp(56px, 3.3vw, 66px); }
    h2 { font-size: clamp(40px, 2.3vw, 46px); margin-bottom: 16px; }
    .lead { font-size: 26px; }
    .body { font-size: 24px; }
    .pill, .slide-sub-tag { font-size: 19px; }
    .cover-left { padding: 40px 44px; }
    .cover-title-sub { font-size: 25px; }
    .ah-card { padding: 18px 18px; }
    .ah-card .ah-num { font-size: 14px; }
    .ah-card h4 { font-size: 22px; }
    .ah-card p { font-size: 17px; }
    .author-name { font-size: 25px; }
    .cover-right { padding: 30px; }
    .cover-right-head { font-size: 19px; }
    .cover-right-foot { font-size: 17px; padding: 14px 18px; }
    .cc-node { padding: 13px 16px; font-size: 18px; }
    .cc-node strong { font-size: 20px; }
    .svg-card { padding: 16px 24px; }
    .agent-box { font-size: 22px; padding: 15px 22px; }
    .tag-ai { font-size: 16px; padding: 4px 12px; }
    .scenario { font-size: 24px; padding: 22px 26px; }
    .vote { min-width: 260px; padding: 16px 24px; font-size: 23px; }
    .vote .cnt { font-size: 46px; }
    .road { padding: 18px 20px; }
    .road h3 { font-size: 26px; }
    .road p { font-size: 19px; }
    .f-card { padding: 24px 22px; }
    .f-card .big { font-size: 38px; }
    .f-card p { font-size: 21px; }
    .oc-item { font-size: 22px; padding: 12px 0; }
    .pt-item { padding: 16px 22px; }
    .pt-item h3 { font-size: 23px; }
    .pt-item p { font-size: 20px; }
    .stat .lab { font-size: 18px; }
    .stat .val { font-size: 36px; }
    .metric .lab { font-size: 17px; }
    .metric .val { font-size: 30px; }
    .slider-box { font-size: 20px; padding: 11px 16px; }
    .rule-row { padding: 18px 24px; }
    .hook-loss { font-size: 54px; }
    .hook-text { font-size: 26px; }
    .duel-pct { font-size: 100px; }
    .duel-tag { font-size: 23px; }
    .duel-lab, .duel-mid { font-size: 21px; }
    .hook-bridge { font-size: 23px; }
    .rule-exp { font-size: 25px; }
    .rule-bias { font-size: 21px; }
    .rule-do { font-size: 22px; }
  }
  @media (max-width: 1100px) {
    .slide { inset: 12px 14px 80px; }
    .cover-grid, .sim, .entry, .roadmap, .compare2, .grid-2col, .formula-row, .agent-highlights, .course-chain, .rule-row, .hook-duel { grid-template-columns: 1fr; }
    h1 { font-size: 36px; }
    h2 { font-size: 26px; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="slides" id="slides"></div>
  <div class="bar">
    <button class="secondary" id="btnPrev" type="button">上一页</button>
    <div style="display:flex;align-items:center;gap:12px;">
      <div class="dots" id="dots"></div>
      <div class="page-num" id="pageNum"></div>
    </div>
    <div class="nav">
      <button class="secondary" id="btnDemo" type="button" style="border-color:var(--blue);color:var(--blue);">评委演示</button>
      <button class="secondary" id="btnFull" type="button">全屏</button>
      <button id="btnNext" type="button">下一页</button>
    </div>
  </div>
</div>

<template id="tpl">
  <!-- 1. 双栏封面：课堂实验 → 市场仿真 → 投资纪律 + 张剑 -->
  <section class="slide" data-id="title">
    <div class="cover-grid">
      <div class="cover-left">
        <div>
          <span class="cover-badge">第二届“鱼凫杯·教师教学竞赛” · 教师教学创新大赛</span>
          <h1>《投资学原理》<br>行为投资课堂实验教学</h1>
          <p class="cover-title-sub">从「课堂偏差实验」到「市场仿真」与「投资纪律」</p>
        </div>

        <div class="agent-highlights">
          <div class="ah-card">
            <div class="ah-num">Step 01 · 课堂体验</div>
            <h4>四个偏差实验</h4>
            <p>心理账户、选美、前景理论、过度自信，现场测出全班偏差</p>
          </div>

    const rate = tot ? (hits / (tot * 4)) * 100 : 0;

  // ----- 5. 实验四：严格对应前三项实验的 ABM 市场出清模型 -----
  const sTrend = document.getElementById("sTrend"); // 实验一：高阶信念（选美预期）主体权重
  const sLoss = document.getElementById("sLoss");   // 实验二：前景理论（处置效应）主体权重
  const sNoise = document.getElementById("sNoise"); // 实验三：过度自信倍数 k = 90% ÷ 实测命中率
  let prices = [100], refPrice = 100, beliefAnchor = 112, simTimer = null, simPlaying = false;
  // 固定随机种子：同一参数下每次演示路径一致
  const SIM_SEED = 20261116;
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  let simRng = mulberry32(SIM_SEED);
  const resetRng = () => { simRng = mulberry32(SIM_SEED); };
  // 权重归一：高阶信念 + 处置效应 ≤ 90%，余量为基本面套利主体
  const BEHAVIOR_CAP = 90;
  function balanceWeights(moved, other) {

    if (over > 0) other.value = Math.max(0, Number(other.value) - over);
    if (Number(moved.value) + Number(other.value) > BEHAVIOR_CAP) moved.value = BEHAVIOR_CAP - Number(other.value);
  }

  function stepMarket(shock = 0) {
    const bW = Number(sTrend.value) / 100; // 高阶信念权重
    const dW = Number(sLoss.value) / 100;  // 处置效应权重
    const rW = 1 - bW - dW;                 // 基本面套利权重（三类主体权重合计 100%）
    const oc = Number(sNoise.value);       // 过度自信倍数 k（k = 1 为校准良好）
    const p = prices[prices.length - 1];

    // 1. 实验一机制：群体高阶信念共识锚（Level-k 猜测他人预期，脱离 V=100 自我强化，遇冲击时共识坍塌）
    if (shock < 0) beliefAnchor = 78;
    else beliefAnchor = Math.max(72, Math.min(165, 100 + 0.92 * (beliefAnchor - 100) + 0.18 * (p - 100)));
    const beautyDemand = bW * 0.32 * (beliefAnchor - p);

    // 2. 实验二机制：前景理论参考点（p > refPrice 浮盈兑现产生抛压；p < refPrice 浅跌惜售阻尼，跌破深水区被动清盘）
    refPrice = 0.85 * refPrice + 0.15 * p;
    let dispDemand = 0;
    if (p > refPrice) dispDemand = -dW * 0.22 * (p - refPrice); // 收益域凹函数：过早止盈抛压
    else if (p > refPrice - 14) dispDemand = dW * 0.25 * (refPrice - p); // 亏损域凸函数：惜售护盘/补仓
    else dispDemand = -dW * 4.2; // 击穿承受底线引发被动连锁平仓

    // 3. 实验三机制：过度自信高估私有信号精度，放大短期交易扰动
    const ocShock = (simRng() - 0.5) * oc * 3.8; // 每步随机扰动 ±1.9k

    // 4. 有效市场基准力量：基本面套利者围绕 V=100 反向修正
    const arbDemand = rW * 0.34 * (100 - p);

    prices.push(Math.max(35, Math.min(200, p + arbDemand + beautyDemand + dispDemand + ocShock + shock)));
    if (prices.length > 60) prices.shift();
    renderChart();
  }

  function renderChart() {
    document.getElementById("vTrend").textContent = sTrend.value + "%";

    document.getElementById("vArb").textContent = arbPct + "%";
    document.getElementById("arbBar").style.width = arbPct + "%";
    const svg = document.getElementById("marketChart");
    const W = 800, H = 420, padL = 55, padR = 20, padT = 20, padB = 30, minY = 30, maxY = 210;
    const mapX = (idx) => padL + (idx / Math.max(1, prices.length - 1)) * (W - padL - padR);
    const mapY = (val) => padT + (1 - (val - minY) / (maxY - minY)) * (H - padT - padB);
    const baseY = mapY(100);
    let html = `<line x1="${padL}" y1="${baseY}" x2="${W - padR}" y2="${baseY}" stroke="#52525b" stroke-width="2" stroke-dasharray="8 6" />`;
    html += `<text x="10" y="${baseY + 6}" font-size="18" fill="#52525b">100</text>`;
    if (prices.length > 1) {
      const pts = prices.map((v, idx) => `${mapX(idx).toFixed(1)},${mapY(v).toFixed(1)}`).join(" ");
      html += `<polyline fill="none" stroke="#0f6e56" stroke-width="4" points="${pts}" />`;
    }
    const last = prices[prices.length - 1];
    const lx = prices.length === 1 ? padL : mapX(prices.length - 1);
    html += `<circle cx="${lx.toFixed(1)}" cy="${mapY(last).toFixed(1)}" r="7" fill="#c2571a" />`;
    svg.innerHTML = html;
    document.getElementById("mPrice").textContent = last.toFixed(1);
    const dev = ((last - 100) / 100) * 100;
    document.getElementById("mDev").textContent = (dev >= 0 ? "+" : "") + dev.toFixed(1) + "%";
    const recent = prices.slice(-11);
    const vol = recent.length > 1 ? recent.slice(1).reduce((a, x, i) => a + Math.abs(x - recent[i]), 0) / (recent.length - 1) : null;
    document.getElementById("mVol").textContent = vol === null ? "—" : vol.toFixed(1);
    document.getElementById("simRound").textContent = "第 " + (prices.length - 1) + " 轮";
  }

  function toggleSimPlay(force) {
    simPlaying = typeof force === "boolean" ? force : !simPlaying;
    document.getElementById("simPlay").textContent = simPlaying ? "暂停" : "自动演化";
    if (simTimer) { clearInterval(simTimer); simTimer = null; }
    if (simPlaying) simTimer = setInterval(() => stepMarket(0), 320);
  }
  sTrend.oninput = () => { balanceWeights(sTrend, sLoss); renderChart(); };
  sLoss.oninput = () => { balanceWeights(sLoss, sTrend); renderChart(); };
  sNoise.oninput = renderChart;
  function updateKHint() {
    let tot = 0, hits = 0;
    ocCounts.forEach((c, k) => { tot += c; hits += c * k; });
    const rate = tot ? hits / (tot * 4) * 100 : 0;
    document.getElementById("kHint").textContent = rate > 0
      ? "k = 1 为校准良好；本班实测：90% ÷ " + rate.toFixed(1) + "% ≈ " + (90 / rate).toFixed(2)
      : "k = 1 为校准良好；k 越大，区间越窄、交易扰动越大";
  }
  document.getElementById("simPlay").onclick = () => toggleSimPlay();
  document.getElementById("simStep").onclick = () => { toggleSimPlay(false); stepMarket(0); };
  const simGuide = document.getElementById("simGuide");
  function setGuide(color, bg, badge, title, desc) {
    simGuide.style.borderLeftColor = color;
    simGuide.style.background = bg;
    simGuide.innerHTML =
      '<div style="font-size:21px;font-weight:800;color:' + color + ';display:flex;align-items:center;gap:10px;">' +
        '<span class="tag-ai" style="background:' + color + ';font-size:16px;padding:4px 12px;margin:0;">' + badge + '</span>' +
        '<span>' + title + '</span>' +
      '</div>' +
      '<div style="font-size:19.5px;line-height:1.55;color:var(--ink);">' + desc + '</div>';
  }
  function resetGuide() {
    setGuide("var(--blue)", "#eef5fb", "演示指引", "核心检验：个体偏差能否撼动市场定价？",
      "• 点击<strong>「场景 A」</strong>：验证套利主导下价格紧贴 <strong>V=100</strong> 收敛<br>• 点击<strong>「场景 B」</strong>：验证高阶信念泡沫与破位连锁下跌");
  }
  document.getElementById("simShock").onclick = () => {
    stepMarket(-14);
    setGuide("var(--bad)", "#fdecec", "冲击响应", "共识情绪坍塌与被动连锁下跌",
      "选美高阶信念预期骤降，价格击穿处置效应主体的<strong>亏损承受底线</strong>，惜售盘集中转为被动平仓，引发剧烈下跌。");
  };
  document.getElementById("simReset").onclick = () => {
    toggleSimPlay(false); resetRng(); prices = [100]; refPrice = 100; beliefAnchor = 112; renderChart();
    resetGuide();
  };
  document.getElementById("simPresetEMH").onclick = () => {
    toggleSimPlay(false);
    sTrend.value = 10; sLoss.value = 10; sNoise.value = 1;
    resetRng(); prices = [100]; refPrice = 100; beliefAnchor = 104;
    for (let k = 0; k < 20; k++) stepMarket(0);
    setGuide("var(--accent-2)", "#e8f6f1", "场景 A", "基本面套利主导（有效市场基准）",
      "三类行为偏差降至低位（过度自信 k = 1，校准良好），套利资金迅速抵消随机扰动，市场出清价格始终紧贴内在价值 <strong>V=100</strong> 平稳收敛。");
    toggleSimPlay(true);
  };
  document.getElementById("simPresetBeh").onclick = () => {
    toggleSimPlay(false);
    sTrend.value = 55; sLoss.value = 35; sNoise.value = 2;
    resetRng(); prices = [100]; refPrice = 100; beliefAnchor = 128;
    for (let k = 0; k < 12; k++) stepMarket(0);
    setGuide("var(--orange)", "#fff8f2", "场景 B", "三类行为偏差共同作用（内生泡沫）",
      "高阶信念（55%）推高共识预期，叠加处置效应（35%）与过度自信（k = 2，本班实测），套利仅余 10%，价格显著脱离 <strong>V=100</strong> 演化出泡沫。");
    toggleSimPlay(true);
  };

  // ----- 评委演示一键填充样本（均值 30.9，目标 20.6，获胜 21） -----
  let demoLoaded = false;
  document.getElementById("btnDemo").onclick = () => {
    if (!demoLoaded) {
      hookVotes[0] = { yes: 20, no: 25 };
      hookVotes[1] = { yes: 39, no: 6 };
      hookI = 2; renderHook();
      nums.splice(0, nums.length, 50, 45, 33, 33, 35, 25, 22, 22, 20, 40, 38, 30, 28, 18, 15, 50, 33, 25, 22, 32, 34, 42, 19, 27, 36, 48, 29, 21, 24, 31);
      revealed = true; renderNums(); updateInsight();
      ptVotes[0] = { a: 36, b: 9 };
      ptVotes[1] = { a: 11, b: 34 };
      renderPT();
      Object.keys(ocAnswers).forEach((k) => { document.getElementById("ocAns" + k).textContent = ocAnswers[k]; });
      [5, 14, 16, 7, 3].forEach((c, idx) => { ocCounts[idx] = c; });
      renderOC();
      sTrend.value = 55; sLoss.value = 35; sNoise.value = 2; resetRng();
      refPrice = 115; beliefAnchor = 126;
      prices = [100, 102.4, 105.8, 111.2, 118.5, 127.0, 134.6, 141.2, 136.5, 128.0, 116.4, 103.2, 92.5, 84.0, 79.5];
      renderChart();
      demoLoaded = true;
      document.getElementById("btnDemo").textContent = "清空演示";
    } else {
      hookVotes[0] = { yes: 0, no: 0 }; hookVotes[1] = { yes: 0, no: 0 }; hookI = 0; renderHook();
      nums.splice(0, nums.length); revealed = false; document.body.classList.remove("is-revealed"); renderNums(); updateInsight();
      ptVotes[0] = { a: 0, b: 0 }; ptVotes[1] = { a: 0, b: 0 }; renderPT();
      Object.keys(ocAnswers).forEach((k) => { document.getElementById("ocAns" + k).textContent = "待揭晓"; });
      for (let k = 0; k < 5; k++) ocCounts[k] = 0; renderOC();
      toggleSimPlay(false); resetRng(); sTrend.value = 35; sLoss.value = 35; sNoise.value = 2; prices = [100]; refPrice = 100; beliefAnchor = 112; renderChart();
      demoLoaded = false;
      document.getElementById("btnDemo").textContent = "评委演示";
    }
  };

  const startHash = location.hash.replace(/^#/, "");
  const start = slides.findIndex((s) => s.dataset.id === startHash);
  show(start >= 0 ? start : 0);
})();
</script>
</body>
</html>
