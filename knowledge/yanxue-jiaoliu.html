<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>经济学是做什么的 · 行为经济学互动讲义</title>
<style>
  :root {
    --bg: #f4efe6;
    --ink: #1c1917;
    --muted: #57534e;
    --paper: #fffcf7;
    --line: #e7e0d4;
    --accent: #0f6e56;
    --accent-2: #0b4f3d;
    --blue: #2c6e9e;
    --orange: #c65d1f;
    --good: #0f6e56;
    --bad: #b42318;
    --shadow: 0 10px 30px rgba(28, 25, 23, .08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    overflow: hidden;
  }
  #app { height: 100%; display: flex; flex-direction: column; }
  .slides { flex: 1; position: relative; }
  .slide {
    position: absolute; inset: 0;
    display: none;
    padding: 36px 56px 104px;
    flex-direction: column;
    justify-content: center;
    text-align: center;
  }
  .slide.on { display: flex; }
  h1 { font-size: 96px; font-weight: 700; letter-spacing: .02em; line-height: 1.2; }
  h2 { font-size: 68px; font-weight: 700; line-height: 1.25; margin-bottom: 22px; }
  .lead { font-size: 48px; line-height: 1.5; color: var(--muted); }
  .body { font-size: 45px; line-height: 1.5; }
  .center { align-items: center; justify-content: center; text-align: center; gap: 24px; }
  .kicker { font-size: 34px; letter-spacing: .18em; color: var(--accent); font-weight: 600; }
  .sub { font-size: 38px; color: var(--muted); }

  .rule-box {
    margin-top: 14px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 30px 38px;
    box-shadow: var(--shadow);
    font-size: 48px;
    line-height: 1.55;
  }
  .rule-box strong { color: var(--accent-2); }

  .row { display: flex; gap: 30px; align-items: stretch; flex: 1; min-height: 0; }
  .col { flex: 1; min-width: 0; }

  button, .btn {
    font: inherit;
    cursor: pointer;
    border: 0;
    background: var(--accent);
    color: white;
    border-radius: 18px;
    padding: 14px 28px;
    font-size: 38px;
    font-weight: 600;
  }
  button.secondary, .btn.secondary {
    background: #fff;
    color: var(--ink);
    border: 1px solid var(--line);
  }
  button:disabled { opacity: .45; cursor: default; }
  button:focus-visible, .card:focus-visible, input:focus-visible, textarea:focus-visible, input[type=range]:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 3px;
  }

  .bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    height: 88px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 28px;
    background: rgba(244, 239, 230, .92);
    border-top: 1px solid var(--line);
    backdrop-filter: blur(8px);
    z-index: 20;
  }
  .dots { display: flex; gap: 10px; align-items: center; }
  .dot {
    width: 14px; height: 14px; border-radius: 50%;
    background: #d6d3d1; border: 0; padding: 0;
  }
  .dot.on { background: var(--accent); transform: scale(1.2); }
  .bar .nav { display: flex; gap: 12px; align-items: center; }
  .page-num { font-size: 31px; color: var(--muted); min-width: 100px; text-align: center; }

  /* guess */
  .entry {
    display: grid;
    grid-template-columns: 1.2fr .8fr;
    gap: 30px;
    flex: 1; min-height: 0;
  }
  .panel {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 26px 30px;
    box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 16px; min-height: 0;
    text-align: left;
  }
  .input-row { display: flex; gap: 14px; align-items: stretch; }
  .input-row input { flex: 1 1 auto; min-width: 0; }
  .input-row button { flex: 0 0 auto; white-space: nowrap; }
  input[type=text], textarea {
    font: inherit; font-size: 42px;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 12px 16px;
    background: #fff;
    color: var(--ink);
    width: 100%;
    text-align: left;
  }
  textarea { min-height: 100px; resize: none; }
  .chips {
    flex: 1; overflow: auto; display: flex; flex-wrap: wrap; gap: 12px; align-content: flex-start;
  }
  .chip {
    background: #efe8db; border-radius: 999px; padding: 10px 18px;
    font-size: 38px; display: inline-flex; gap: 10px; align-items: center;
  }
  .chip button {
    background: transparent; color: var(--muted); padding: 0; font-size: 34px; line-height: 1;
  }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .stat {
    background: #f8f3ea; border-radius: 18px; padding: 20px 24px;
  }
  .stat .lab { font-size: 31px; color: var(--muted); }
  .stat .val { font-size: 62px; font-weight: 700; margin-top: 6px; }
  .stat.wide { grid-column: 1 / -1; }
  .winners { font-size: 45px; font-weight: 700; color: var(--accent-2); }
  .hidden-until.reveal-on { display: none; }
  body.is-revealed .hidden-until.reveal-on { display: block; }
  .hint { font-size: 31px; color: var(--muted); }

  .stair {
    display: flex; gap: 16px; justify-content: center; flex-wrap: wrap;
    margin: 30px 0 10px;
  }
  .stair span {
    background: var(--paper); border: 1px solid var(--line);
    border-radius: 16px; padding: 14px 22px; font-size: 45px; font-weight: 700;
  }
  .stair span.fade { color: var(--muted); font-weight: 600; }

  /* cards */
  .cards {
    display: flex; gap: 28px; justify-content: center; margin: 20px 0 18px;
    flex-wrap: wrap;
  }
  .card-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 230px; }
  .card {
    width: 230px; height: 250px;
    border: 3px solid #d6d3d1;
    background: #fff;
    color: var(--ink);
    border-radius: 26px;
    box-shadow: var(--shadow);
    font-size: 90px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 12px;
    transition: border-color .15s, transform .15s, background .15s;
  }
  .card.small-text { font-size: 56px; line-height: 1.25; }
  .card.picked { border-color: var(--accent); background: #e8f6f1; transform: translateY(-6px); }
  .card.correct { border-color: var(--good); background: #e8f6f1; }
  .card.wrong { border-color: var(--bad); background: #fdecec; }
  .card.idle { opacity: .72; }
  .tag { font-size: 34px; color: var(--muted); min-height: 40px; font-weight: 600; }
  .tag.good { color: var(--good); }
  .tag.bad { color: var(--bad); }
  .explain {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 20px 28px;
    font-size: 42px;
    line-height: 1.5;
    min-height: 120px;
    box-shadow: var(--shadow);
  }
  .actions { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }

  .compare {
    display: grid; grid-template-columns: 1fr auto 1fr; gap: 28px;
    align-items: center; margin-top: 10px;
  }
  .pair {
    background: var(--paper); border: 1px solid var(--line); border-radius: 22px;
    padding: 28px; box-shadow: var(--shadow); text-align: center;
  }
  .pair h3 { font-size: 42px; margin-bottom: 14px; }
  .pair .map { font-size: 45px; line-height: 1.6; }
  .eq { font-size: 82px; font-weight: 700; color: var(--accent-2); }

  /* schelling */
  .sim { display: grid; grid-template-columns: 1fr 600px; gap: 28px; flex: 1; min-height: 0; }
  #board-wrap {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 24px;
    box-shadow: var(--shadow);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; min-height: 0;
  }
  #board { width: 100%; height: 100%; max-height: 100%; }
  .controls { display: flex; flex-direction: column; gap: 10px; text-align: left; }
  .metric {
    background: var(--paper); border: 1px solid var(--line); border-radius: 18px;
    padding: 12px 18px;
  }
  .metric .lab { font-size: 31px; color: var(--muted); }
  .metric .val { font-size: 56px; font-weight: 700; }
  input[type=range] { width: 100%; height: 36px; }
  .legend { display: flex; flex-direction: column; gap: 6px; font-size: 31px; color: var(--muted); }
  .legend .row2 { display: flex; align-items: center; gap: 10px; }
  .swatch { width: 20px; height: 20px; border-radius: 50%; display: inline-block; }
  .swatch.a { background: var(--blue); }
  .swatch.b { background: var(--orange); }
  .ctrl-btns { display: flex; flex-wrap: wrap; gap: 12px; }
  .ctrl-btns button { font-size: 34px; padding: 10px 18px; }

  .takeaways { list-style: none; display: flex; flex-direction: column; gap: 18px; margin-top: 20px; max-width: 1720px; margin-left: auto; margin-right: auto; }
  .takeaways li {
    background: var(--paper); border: 1px solid var(--line); border-radius: 20px;
    padding: 20px 28px; font-size: 45px; line-height: 1.45;
    box-shadow: var(--shadow);
  }
  .takeaways li b { color: var(--accent-2); margin-right: 8px; }

  .scenes {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 24px;
    margin-top: 10px;
  }
  .scene {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 26px;
    box-shadow: var(--shadow);
  }
  .scene h3 { font-size: 42px; margin-bottom: 12px; }
  .scene p { font-size: 38px; line-height: 1.45; color: var(--muted); }

  .roadmap {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    margin-top: 8px;
  }
  .road {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 22px 26px;
    box-shadow: var(--shadow);
  }
  .road .num { color: var(--accent); font-weight: 700; font-size: 34px; }
  .road h3 { font-size: 45px; margin: 4px 0 8px; }
  .road p { font-size: 38px; color: var(--muted); line-height: 1.45; }

  .scenario {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 26px 32px;
    box-shadow: var(--shadow);
    font-size: 45px;
    line-height: 1.5;
    margin-bottom: 16px;
  }
  .votes { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; margin: 10px 0 16px; }
  .vote {
    min-width: 300px;
    background: #fff;
    color: var(--ink);
    border: 3px solid var(--line);
    border-radius: 22px;
    padding: 18px 26px;
    font-size: 42px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .vote .cnt { font-size: 68px; font-weight: 700; line-height: 1.1; }
  .compare2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 10px; }
  .offer-pad { display: flex; flex-wrap: wrap; gap: 12px; }
  .offer-pad button { min-width: 70px; background: #fff; color: var(--ink); border: 1px solid var(--line); padding: 12px 0; }
  .offer-pad button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .ulog { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
  .ulog .item { font-size: 38px; background: #f8f3ea; border-radius: 14px; padding: 10px 16px; display: flex; justify-content: space-between; gap: 16px; }

  @media (max-width: 1100px) {
    .slide { padding: 28px 24px 100px; }
    h1 { font-size: 70px; }
    h2 { font-size: 54px; }
    .sim, .entry, .compare { grid-template-columns: 1fr; }
    .card, .card-wrap { width: 190px; }
    .card { height: 210px; font-size: 64px; }
    .scenes, .roadmap, .compare2 { grid-template-columns: 1fr; }
  }

  /* ----- econ intro slides (10-min module) ----- */
  .econ-slide {
    text-align: left;
    justify-content: flex-start;
    padding: 24px 48px 98px;
    overflow-y: auto;
  }
  .econ-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 10px;
  }
  .econ-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #e8f6f1;
    color: var(--accent-2);
    border: 1px solid #b7dfd2;
    border-radius: 999px;
    padding: 6px 18px;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: .04em;
  }
  .econ-subtag {
    font-size: 22px;
    color: var(--muted);
    font-weight: 600;
  }
  .econ-slide h2 {
    font-size: 46px;
    line-height: 1.2;
    margin-bottom: 16px;
  }
  .econ-grid {
    display: grid;
    grid-template-columns: 0.96fr 1.14fr;
    gap: 24px;
    flex: 1;
    min-height: 0;
    align-items: stretch;
  }
  .econ-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 22px 26px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-height: 0;
  }
  .econ-q {
    font-size: 27px;
    line-height: 1.48;
    color: var(--ink);
  }
  .econ-q strong { color: var(--accent-2); }
  .econ-votes {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .econ-vbtn {
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    width: 100%;
    text-align: left;
    background: #fff;
    color: var(--ink);
    border: 2px solid var(--line);
    border-radius: 16px;
    padding: 13px 18px;
    font-size: 25px;
    font-weight: 600;
    transition: border-color .15s, transform .12s;
  }
  .econ-vbtn:hover { border-color: var(--accent); transform: translateY(-1px); }
  .econ-vbtn.active { border-color: var(--accent); background: #f2fbf8; }
  .econ-vbtn .vfill {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
    background: rgba(15, 110, 86, .11);
    transition: width .35s ease;
    pointer-events: none;
  }
  .econ-vbtn.orange .vfill { background: rgba(198, 93, 31, .13); }
  .econ-vbtn.blue .vfill { background: rgba(44, 110, 158, .13); }
  .econ-vbtn .vtxt { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 2px; }
  .econ-vbtn .vsub { font-size: 19px; color: var(--muted); font-weight: 500; }
  .econ-vbtn .vnum {
    position: relative; z-index: 1;
    display: flex; align-items: baseline; gap: 8px; white-space: nowrap;
    font-size: 30px; font-weight: 800; color: var(--accent-2);
  }
  .econ-vbtn .vpct { font-size: 20px; color: var(--muted); font-weight: 600; }
  .econ-actions {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  }
  .econ-actions button {
    font-size: 22px; padding: 10px 20px; border-radius: 14px;
  }
  .econ-takeaway {
    margin-top: auto;
    background: #f5efe3;
    border-left: 5px solid var(--accent);
    border-radius: 14px;
    padding: 14px 18px;
    font-size: 23px;
    line-height: 1.5;
    color: var(--ink);
  }
  .econ-takeaway strong { color: var(--accent-2); }
  .econ-svg-box {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 16px 20px 14px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .econ-svg-title {
    font-size: 21px;
    font-weight: 700;
    color: var(--blue);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .econ-svg-title span.badge {
    font-size: 18px;
    background: #eef5fb;
    color: var(--blue);
    padding: 4px 12px;
    border-radius: 999px;
    font-weight: 600;
  }
  .econ-svg-wrap {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .econ-svg-wrap svg {
    width: 100%;
    height: 100%;
    max-height: 540px;
  }

  /* SVG animations */
  @keyframes econDash { to { stroke-dashoffset: -36; } }
  @keyframes econFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @keyframes econScaleIdle { 0%, 100% { transform: rotate(-3.5deg); } 50% { transform: rotate(3.5deg); } }
  @keyframes econSpot { 0%, 100% { opacity: .24; } 50% { opacity: .45; } }
  @keyframes econDrop { 0% { transform: translateY(-28px); opacity: 0; } 35% { opacity: 1; } 75% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(6px); opacity: 0; } }
  @keyframes econWalk { 0% { transform: translateX(0); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateX(175px); opacity: 0; } }
  @keyframes econBounceBack { 0% { transform: translateX(0); } 48% { transform: translateX(72px); } 60% { transform: translateX(64px); } 100% { transform: translateX(0); } }
  .econ-flow { stroke-dasharray: 10 8; animation: econDash 1.1s linear infinite; }
  .econ-float { animation: econFloat 2.8s ease-in-out infinite; }
  .econ-beam { transform-box: fill-box; transform-origin: center top; }
  .econ-beam.idle { animation: econScaleIdle 4s ease-in-out infinite; }
  .econ-spot { animation: econSpot 3.2s ease-in-out infinite; }
  .econ-coin-anim { animation: econDrop 2.2s ease-in-out infinite; }
  .econ-walk-1 { animation: econWalk 2.6s linear infinite; }
  .econ-walk-2 { animation: econWalk 2.6s linear 1.3s infinite; }
  .econ-bounce { animation: econBounceBack 2.8s ease-in-out infinite; }

  @media (max-width: 1180px) {
    .econ-grid { grid-template-columns: 1fr; }
    .econ-slide h2 { font-size: 36px; }
  }

  /* ----- grand finale slide (junior high students) ----- */
  .finale-slide {
    text-align: left;
    justify-content: space-between;
    padding: 22px 48px 98px;
    overflow-y: auto;
    gap: 14px;
  }
  .finale-top {
    text-align: center;
  }
  .finale-kicker {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(90deg, #fef3c7, #fde68a);
    color: #92400e;
    border: 1.5px solid #f59e0b;
    border-radius: 999px;
    padding: 6px 22px;
    font-size: 21px;
    font-weight: 800;
    letter-spacing: .06em;
    margin-bottom: 8px;
  }
  .finale-top h2 {
    font-size: 48px;
    line-height: 1.18;
    margin-bottom: 4px;
    color: var(--ink);
  }
  .finale-top h2 span { color: var(--accent-2); }
  .finale-sub {
    font-size: 23px;
    color: var(--muted);
  }
  .finale-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    flex: 1;
    min-height: 0;
  }
  .medal-card {
    position: relative;
    background: var(--paper);
    border: 2px solid var(--line);
    border-radius: 22px;
    padding: 20px 26px;
    box-shadow: var(--shadow);
    display: grid;
    grid-template-columns: 88px 1fr;
    gap: 20px;
    align-items: center;
    transition: transform .22s, border-color .22s, box-shadow .22s;
  }
  .medal-card.mvp {
    border-color: #d97706;
    background: linear-gradient(135deg, #fffdf7 0%, #fef9ea 100%);
    box-shadow: 0 12px 30px rgba(217, 119, 6, .16);
  }
  @keyframes medalPop {
    0% { opacity: 0; transform: translateY(14px) scale(.96); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  .slide.on .medal-card { animation: medalPop .48s cubic-bezier(.22,1,.36,1) backwards; }
  .slide.on .medal-card:nth-child(1) { animation-delay: .05s; }
  .slide.on .medal-card:nth-child(2) { animation-delay: .18s; }
  .slide.on .medal-card:nth-child(3) { animation-delay: .31s; }
  .slide.on .medal-card:nth-child(4) { animation-delay: .44s; }
  @keyframes ringSpin { to { transform: rotate(360deg); } }
  .medal-ring { transform-origin: 40px 40px; animation: ringSpin 18s linear infinite; }
  .medal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 5px;
  }
  .nobel-tag {
    display: inline-block;
    font-size: 18px;
    font-weight: 800;
    padding: 4px 13px;
    border-radius: 999px;
    background: #fef3c7;
    color: #92400e;
    border: 1px solid #f59e0b;
  }
  .nobel-tag.sci {
    background: #eef5fb;
    color: var(--blue);
    border-color: #bfd7ea;
  }
  .like-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #fff;
    color: var(--ink);
    border: 1.5px solid var(--line);
    border-radius: 999px;
    padding: 6px 16px;
    font-size: 20px;
    font-weight: 700;
    transition: border-color .15s, background .15s, transform .12s;
  }
  .like-btn:hover { border-color: #d97706; transform: scale(1.04); }
  .medal-card.mvp .like-btn {
    background: #fef3c7;
    border-color: #d97706;
    color: #92400e;
  }
  .medal-title {
    font-size: 30px;
    font-weight: 800;
    color: var(--ink);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .mvp-crown {
    display: none;
    font-size: 16px;
    font-weight: 800;
    background: #d97706;
    color: #fff;
    padding: 3px 12px;
    border-radius: 999px;
  }
  .medal-card.mvp .mvp-crown { display: inline-block; }
  .medal-desc {
    font-size: 24px;
    line-height: 1.44;
    color: var(--ink);
  }
  .medal-rec {
    margin-top: 8px;
    font-size: 19px;
    font-weight: 600;
    color: var(--accent-2);
    background: #edf7f3;
    display: inline-block;
    padding: 4px 13px;
    border-radius: 8px;
  }
  .finale-banner {
    background: linear-gradient(120deg, #0b4f3d 0%, #0f6e56 58%, #1d5d8f 100%);
    color: #fff;
    border-radius: 22px;
    padding: 18px 28px;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 22px;
  }
  .finale-banner-main {
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .finale-quote {
    font-size: 25px;
    font-weight: 700;
    line-height: 1.42;
  }
  .finale-quote span {
    display: block;
    margin-top: 4px;
    font-size: 20px;
    font-weight: 600;
    color: #fde68a;
  }
  .finale-reset {
    background: rgba(255,255,255,.14);
    color: #fff;
    border: 1px solid rgba(255,255,255,.32);
    font-size: 18px;
    padding: 8px 16px;
    border-radius: 12px;
    white-space: nowrap;
  }
  .finale-reset:hover { background: rgba(255,255,255,.24); }
</style>

  <section class="slide" data-id="hook">
    <h2>人做决定时，真的「理性」吗？</h2>
    <p class="body" style="font-size:36px;color:var(--muted);line-height:1.45;margin-bottom:14px;">前面四问说的都是教科书上「会算账的理性人」：权衡取舍、对激励反应、被价格协调。可心理学家和经济学家发现，<strong style="color:var(--bad);">真实的人做决定时常常不是这么算的</strong>——这就是「行为经济学」要研究的。先拿一个日常问题测测你自己：</p>
    <div id="hookPlay">
      <div class="scenario" id="hookScene"></div>
      <div class="votes">
        <button type="button" class="vote" id="voteYes"><span>会再买</span><span class="cnt" id="yesCnt">0</span></button>
        <button type="button" class="vote" id="voteNo"><span>不再买</span><span class="cnt" id="noCnt">0</span></button>
      </div>
      <div class="actions">
        <button class="secondary" type="button" id="hookReset">人数清零</button>
        <button type="button" id="hookNext">下一问</button>

    </div>
    <div id="hookResult" hidden>
      <div class="compare2">
        <div class="scenario" id="hookSumA"></div>
        <div class="scenario" id="hookSumB"></div>
      </div>
      <p class="body" style="margin-top:22px;">两次都是少了 40 元，然后还要决定要不要看电影。钱一样多，很多人的感受却不一样。</p>
    </div>
    <p class="hint" id="hookHint" style="margin-top:14px;font-size:34px;">请先听完情景，再举手。我在屏幕上记下人数。</p>
  </section>

  <section class="slide" data-id="what-is">
    <h2>行为经济学在看什么</h2>
    <p class="body">不是说人笨，而是人做决定时，会受比较、说法、别人的影响，并不像一台只会算账的机器。</p>
    <div class="scenes">
      <div class="scene">
        <h3>倒计时</h3>
        <p>「再过 10 分钟优惠就没了。」怕错过，往往比「能省多少」更催人行动。</p>
      </div>
      <div class="scene">
        <h3>已经付出</h3>
        <p>「都排了这么久，不吃有点亏。」已经花掉的时间，仍会把你往前推。</p>
      </div>
      <div class="scene">
        <h3>别人都在</h3>
        <p>旁边的人都举手、都在排队，你也更容易跟着走。</p>
      </div>
    </div>
    <p class="body" style="margin-top:24px;">刚才丢票的问题，就是其中一种。今天你们不是来听长篇定义的，是来当实验里的主角。</p>
  </section>

      <div class="road"><div class="num">实验二</div><h3>翻几张卡片</h3><p>怎样检查一条规则：是去证明它对，还是试着证明它错。</p></div>
      <div class="road"><div class="num">实验三</div><h3>分 10 个代币</h3><p>面对公平和不公平，你会怎么选。</p></div>

  <section class="slide" data-id="guess-rule">
    <h2>第一个实验：猜一个数字</h2>
    <div class="rule-box">
      请在便签上写一个 <strong>0 到 100</strong> 的整数。<br>
      我算出全班这些数的平均数，再乘以 <strong>三分之二</strong>，得到一个目标数。<br>
      <strong>谁写的数最接近这个目标，谁就获胜。</strong>
    </div>
    <p class="hint" style="margin-top:20px;font-size:38px;">写的时候请不要商量，写完把字朝下。</p>
  </section>

<script>
(function () {
  const slidesRoot = document.getElementById("slides");
  const tpl = document.getElementById("tpl");
  [...tpl.content.children].forEach((el) => slidesRoot.appendChild(el));
  const slides = [...slidesRoot.querySelectorAll(".slide")];
  let i = 0;

  const dots = document.getElementById("dots");
  slides.forEach((_, idx) => {
    const b = document.createElement("button");
    b.className = "dot";
    b.type = "button";
    b.addEventListener("click", () => show(idx));
    dots.appendChild(b);
  });

  function show(n) {
    i = Math.max(0, Math.min(slides.length - 1, n));
    slides.forEach((s, k) => s.classList.toggle("on", k === i));
    [...dots.children].forEach((d, k) => d.classList.toggle("on", k === i));
    document.getElementById("pageNum").textContent = (i + 1) + " / " + slides.length;
    document.getElementById("btnPrev").disabled = i === 0;
    document.getElementById("btnNext").textContent = i === slides.length - 1 ? "回到封面" : "下一页";
    if (slides[i].dataset.id === "guess-insight") updateInsight();
    if (slides[i].dataset.id === "ultimatum-insight") updateUInsight();
    if (slides[i].dataset.id === "schelling") { resizeBoard(); renderBoard(false); }
    if (typeof syncEconSlides === "function") syncEconSlides(slides[i].dataset.id);
    if (location.hash !== "#" + slides[i].dataset.id) {
      history.replaceState(null, "", "#" + slides[i].dataset.id);
    }
  }

  document.getElementById("btnPrev").onclick = () => show(i - 1);
  document.getElementById("btnNext").onclick = () => show(i === slides.length - 1 ? 0 : i + 1);
  document.getElementById("btnFull").onclick = toggleFull;

  function toggleFull() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
    else document.exitFullscreen().catch(() => {});
  }
  document.addEventListener("fullscreenchange", () => {
    document.getElementById("btnFull").textContent = document.fullscreenElement ? "退出全屏" : "全屏";
    resizeBoard();
  });

  function typing() {
    const el = document.activeElement;
    return el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA");
  }
  document.addEventListener("keydown", (e) => {
    if (typing()) return;
    if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") {
      if (e.key === " " && slides[i].dataset.id === "schelling") { e.preventDefault(); togglePlay(); return; }
      e.preventDefault();
      if (i < slides.length - 1) show(i + 1);
    } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
      e.preventDefault();
      show(i - 1);
    } else if (e.key === "Home") show(0);
    else if (e.key === "End") show(slides.length - 1);
    else if (e.key === "f" || e.key === "F") toggleFull();
  });

  // ----- guess -----
  const nums = [];
  const numIn = document.getElementById("numIn");
  const chips = document.getElementById("chips");
  let revealed = false;

  function parseNums(text) {
    return (text || "").split(/[,，、\s]+/).map((s) => s.trim()).filter(Boolean).map((s) => Number(s)).filter((n) => Number.isInteger(n) && n >= 0 && n <= 100);
  }
  function addNums(arr) {
    arr.forEach((n) => nums.push(n));
    revealed = false;
    document.body.classList.remove("is-revealed");
    renderNums();
  }
  function renderNums() {
    chips.innerHTML = "";
    nums.forEach((n, idx) => {
      const el = document.createElement("span");
      el.className = "chip";
      el.innerHTML = n + ' <button type="button" aria-label="删除">×</button>';
      el.querySelector("button").onclick = () => { nums.splice(idx, 1); revealed = false; document.body.classList.remove("is-revealed"); renderNums(); };
      chips.appendChild(el);
    });
    document.getElementById("countHint").textContent = nums.length ? ("已录入 " + nums.length + " 个数。点芯片上的 × 可删去录错的。") : "还没有录入。";
    document.getElementById("stN").textContent = nums.length ? String(nums.length) : "—";
    document.getElementById("btnReveal").disabled = nums.length === 0;
    if (revealed) showReveal();
    else {
      document.getElementById("stAvg").textContent = "—";
      document.getElementById("stTarget").textContent = "—";
      document.getElementById("stWin").textContent = "—";
    }
  }
  function fmt(n) { return Number.isInteger(n) ? String(n) : n.toFixed(1); }
  function showReveal() {
    const n = nums.length;
    const avg = nums.reduce((a, b) => a + b, 0) / n;
    const target = avg * 2 / 3;
    let best = Infinity;
    nums.forEach((x) => { best = Math.min(best, Math.abs(x - target)); });
    const winners = [...new Set(nums.filter((x) => Math.abs(x - target) - best < 1e-9))].sort((a, b) => a - b);
    document.getElementById("stAvg").textContent = fmt(avg);
    document.getElementById("stTarget").textContent = fmt(target);
    document.getElementById("stWin").textContent = winners.join("、") + "（相差 " + fmt(best) + "）";
    document.body.classList.add("is-revealed");
  }
  document.getElementById("btnAdd").onclick = () => {
    const arr = parseNums(numIn.value);
    if (!arr.length) return;
    addNums(arr); numIn.value = ""; numIn.focus();
  };
  numIn.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); document.getElementById("btnAdd").click(); }
  });
  document.getElementById("btnPaste").onclick = () => {
    const arr = parseNums(document.getElementById("numPaste").value);
    if (!arr.length) return;
    addNums(arr);
    document.getElementById("numPaste").value = "";
  };
  document.getElementById("btnClear").onclick = () => {
    nums.splice(0, nums.length);
    revealed = false;
    document.body.classList.remove("is-revealed");
    renderNums();
  };
  document.getElementById("btnReveal").onclick = () => {
    if (!nums.length) return;
    revealed = true;
    showReveal();
  };
  function updateInsight() {
    const line = document.getElementById("insightReal");
    if (revealed && nums.length) {
      const avg = nums.reduce((a, b) => a + b, 0) / nums.length;
      const target = avg * 2 / 3;
      line.textContent = "刚才全班 " + nums.length + " 个人，平均数是 " + fmt(avg) + "，目标是 " + fmt(target) + "。大家既没有都走到 0，也不是随便写。";
    } else {
      line.textContent = "真实的人通常不会一路走到 0，也不会完全随便写。";
    }
  }

  // ----- Wason cards -----
  function mountCards(cfg) {
    const root = document.getElementById(cfg.root);
    const explain = document.getElementById(cfg.explain);
    const btnR = document.getElementById(cfg.reveal);
    const btnN = document.getElementById(cfg.next);
    const btnReset = document.getElementById(cfg.reset);
    let picked = new Set();
    let phase = "pick"; // pick | revealed | walk
    let step = 0;

    function render() {
      root.innerHTML = "";
      cfg.items.forEach((it) => {
        const wrap = document.createElement("div");
        wrap.className = "card-wrap";
        const b = document.createElement("button");
        b.type = "button";
        b.className = "card" + (it.face.length >= 2 && /[^A-Za-z0-9]/.test(it.face) ? " small-text" : "");
        b.textContent = it.face;
        if (phase === "pick" && picked.has(it.id)) b.classList.add("picked");
        if (phase !== "pick") {
          if (it.must) b.classList.add("correct");
          else if (picked.has(it.id)) b.classList.add("wrong");
          else b.classList.add("idle");
        }
        b.onclick = () => {
          if (phase !== "pick") return;
          if (picked.has(it.id)) picked.delete(it.id); else picked.add(it.id);
          render();
        };
        const tag = document.createElement("div");
        tag.className = "tag";
        if (phase !== "pick") {
          if (it.must) { tag.textContent = "必须翻"; tag.classList.add("good"); }
          else { tag.textContent = "不用翻"; if (picked.has(it.id)) tag.classList.add("bad"); }
        } else if (picked.has(it.id)) tag.textContent = "要翻";
        wrap.appendChild(b); wrap.appendChild(tag);
        root.appendChild(wrap);
      });
    }

    function reset() {
      picked = new Set();
      phase = "pick";
      step = 0;
      explain.textContent = cfg.prompt;
      btnR.hidden = false;
      btnN.hidden = true;
      btnN.textContent = "下一步";
      render();
    }

    btnR.onclick = () => {
      phase = "revealed";
      step = 0;
      explain.textContent = cfg.revealText;
      btnR.hidden = true;
      btnN.hidden = false;
      render();
    };
    btnN.onclick = () => {
      step += 1;
      if (step <= cfg.steps.length) {
        explain.textContent = cfg.steps[step - 1];
        if (step === cfg.steps.length) btnN.textContent = "说完了";
      }
    };
    btnReset.onclick = reset;
    reset();
  }

  mountCards({
    root: "absCards", explain: "absExplain", reveal: "absReveal", next: "absNext", reset: "absReset",
    prompt: "要检查规则是否成立，必须翻哪几张？先独立想，再举手。点选大家要翻的卡片，然后揭晓。",
    revealText: "正确答案只翻 A 和 7。点「下一步」，我们一张一张看为什么。",
    items: [
      { id: "A", face: "A", must: true },
      { id: "B", face: "B", must: false },
      { id: "2", face: "2", must: false },
      { id: "7", face: "7", must: true }
    ],
    steps: [
      "必须翻 A：假如它的背面是奇数，规则就破了。",
      "必须翻 7：假如它的背面是元音，规则也破了。",
      "不用翻 B：它不是元音，规则根本不管它。",
      "不用翻 2：背面无论是什么字母，都推不翻这条规则。翻它只能再确认一次，不能用来证伪。"
    ]
  });

  mountCards({
    root: "lifeCards", explain: "lifeExplain", reveal: "lifeReveal", next: "lifeNext", reset: "lifeReset",
    prompt: "再给大约 20 秒，先不要商量。点选出大家的选择后揭晓。",
    revealText: "要翻的是「骑电动车」和「没戴头盔」。点「下一步」，对照刚才那一题。",
    items: [
      { id: "ride", face: "骑电动车", must: true },
      { id: "walk", face: "走路", must: false },
      { id: "helm", face: "戴了头盔", must: false },
      { id: "no", face: "没戴头盔", must: true }
    ],
    steps: [
      "必须翻「骑电动车」：假如背面是没戴头盔，就违规了。它对应上一题的 A。",
      "必须翻「没戴头盔」：假如背面是骑电动车，也违规了。它对应上一题的 7。",
      "不用翻「走路」：规则不管走路的人。它对应上一题的 B。",
      "不用翻「戴了头盔」：无论是谁戴的，都推不翻这条规则。它对应上一题的 2。"
    ]
  });

  // ----- opening hook -----
  const hookScenes = [
    { title: "情景一", text: "你提前买好一张 40 元的电影票。到了门口，发现票丢了。售票处还在卖同样的票。你会再买一张吗？" },
    { title: "情景二", text: "你打算到了门口再买票。到了才发现，准备买票的 40 元丢了。钱包里还有别的钱，电影票仍是 40 元。你还会买吗？" }
  ];
  const hookVotes = [{yes:0,no:0},{yes:0,no:0}];
  let hookI = 0;
  function renderHook() {
    const play = document.getElementById("hookPlay");
    const result = document.getElementById("hookResult");
    if (hookI >= 2) {
      play.hidden = true;
      result.hidden = false;
      document.getElementById("hookSumA").innerHTML = "<strong>情景一：票丢了</strong><br>会再买 " + hookVotes[0].yes + " 人，不再买 " + hookVotes[0].no + " 人。";
      document.getElementById("hookSumB").innerHTML = "<strong>情景二：钱丢了</strong><br>会再买 " + hookVotes[1].yes + " 人，不再买 " + hookVotes[1].no + " 人。";
      document.getElementById("hookHint").textContent = "两次少的钱一样多，决定却可能不一样。";
      return;
    }
    play.hidden = false;
    result.hidden = true;
    const s = hookScenes[hookI];
    document.getElementById("hookScene").innerHTML = "<strong>" + s.title + "</strong><br>" + s.text;
    document.getElementById("yesCnt").textContent = hookVotes[hookI].yes;
    document.getElementById("noCnt").textContent = hookVotes[hookI].no;
    document.getElementById("hookNext").textContent = hookI === 0 ? "下一问" : "看这两问有什么不一样";
    document.getElementById("hookHint").textContent = "请先听完情景，再举手。点按钮记下人数，点错了可以先清零。";
  }
  document.getElementById("voteYes").onclick = () => { hookVotes[hookI].yes++; renderHook(); };
  document.getElementById("voteNo").onclick = () => { hookVotes[hookI].no++; renderHook(); };
  document.getElementById("hookReset").onclick = () => { hookVotes[hookI] = {yes:0,no:0}; renderHook(); };
  document.getElementById("hookNext").onclick = () => { hookI += 1; renderHook(); };
  renderHook();

  // ----- ultimatum -----
  const uRows = [];
  let uPick = null;
  const offerPad = document.getElementById("offerPad");
  for (let n = 0; n <= 10; n++) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = String(n);
    b.onclick = () => { uPick = n; [...offerPad.children].forEach((x, i) => x.classList.toggle("on", i === n)); };
    offerPad.appendChild(b);
  }
  function renderU() {
    const log = document.getElementById("uLog");
    log.innerHTML = "";
    uRows.forEach((r) => {
      const el = document.createElement("div");
      el.className = "item";
      el.innerHTML = "<span>分给对方 " + r.offer + "，自己留 " + (10 - r.offer) + "</span><span>" + (r.accept ? "接受" : "拒绝，两人都是 0") + "</span>";
      log.appendChild(el);
    });
    const n = uRows.length;
    document.getElementById("uN").textContent = n ? String(n) : "—";
    if (!n) {
      document.getElementById("uRej").textContent = "—";
      document.getElementById("uAvg").textContent = "—";
      document.getElementById("uHint").textContent = "还没有录入。先点分给对方的数量。";
      return;
    }
    const rej = uRows.filter((r) => !r.accept).length;
    const avg = uRows.reduce((a, r) => a + r.offer, 0) / n;
    document.getElementById("uRej").textContent = String(rej);
    document.getElementById("uAvg").textContent = (Number.isInteger(avg) ? String(avg) : avg.toFixed(1));
    document.getElementById("uHint").textContent = "已录入 " + n + " 组。点错了可撤销上一条。";
  }
  function addU(accept) {
    if (uPick === null) { document.getElementById("uHint").textContent = "请先点「分给对方几个」。"; return; }
    uRows.push({ offer: uPick, accept: accept });
    uPick = null;
    [...offerPad.children].forEach((x) => x.classList.remove("on"));
    renderU();
  }
  document.getElementById("uAccept").onclick = () => addU(true);
  document.getElementById("uReject").onclick = () => addU(false);
  document.getElementById("uUndo").onclick = () => { uRows.pop(); renderU(); };
  function updateUInsight() {
    const el = document.getElementById("uInsight");
    const n = uRows.length;
    if (!n) {
      el.textContent = "如果只按「多一点是一点」来算，对方给 1 个代币也该接受，因为 1 比 0 多。可是太不公平的方案，常常有人宁愿自己也拿不到，也要拒绝。";
      return;
    }
    const rej = uRows.filter((r) => !r.accept);
    const avg = uRows.reduce((a, r) => a + r.offer, 0) / n;
    let extra = "刚才全班 " + n + " 组，平均分给对方 " + (Number.isInteger(avg) ? avg : avg.toFixed(1)) + " 个代币";
    if (rej.length) extra += "，有 " + rej.length + " 组被拒绝，被拒绝的方案里分给对方的是 " + rej.map((r) => r.offer).join("、");
    else extra += "，这次没有人拒绝";
    el.textContent = extra + "。如果只按「多一点是一点」来算，给 1 个也该接受；可是太不公平时，有人宁愿自己也拿不到，也要拒绝。";
  }
  renderU();

  // ----- Schelling -----
  const N = 18, EMPTY = 0.12;
  const BLUE = "#2c6e9e", ORANGE = "#c65d1f";
  let grid = [];
  let playing = false;
  let timer = null;
  const svg = document.getElementById("board");
  const thr = document.getElementById("thr");

  function emptyList() {
    const e = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (grid[r][c] === 0) e.push([r, c]);
    return e;
  }
  function neighbors(r, c) {
    const out = [];
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      if (!dr && !dc) continue;
      const rr = r + dr, cc = c + dc;
      if (rr >= 0 && rr < N && cc >= 0 && cc < N) out.push([rr, cc]);
    }
    return out;
  }
  function threshold() { return Number(thr.value) / 100; }
  function happyAt(r, c, t) {
    const typ = grid[r][c];
    if (!typ) return true;
    let same = 0, tot = 0;
    neighbors(r, c).forEach(([rr, cc]) => {
      if (grid[rr][cc]) { tot++; if (grid[rr][cc] === typ) same++; }
    });
    if (!tot) return true;
    return same / tot + 1e-9 >= t;
  }
  function stats() {
    const t = threshold();
    let unhappy = 0, occupied = 0, segSum = 0, segN = 0;
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      if (!grid[r][c]) continue;
      occupied++;
      if (!happyAt(r, c, t)) unhappy++;
      let same = 0, tot = 0;
      neighbors(r, c).forEach(([rr, cc]) => {
        if (grid[rr][cc]) { tot++; if (grid[rr][cc] === grid[r][c]) same++; }
      });
      if (tot) { segSum += same / tot; segN++; }
    }
    return { unhappy, occupied, seg: segN ? segSum / segN : 0 };
  }
  function shuffle() {
    const cells = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) cells.push([r, c]);
    for (let k = cells.length - 1; k > 0; k--) {
      const j = Math.floor(Math.random() * (k + 1));
      [cells[k], cells[j]] = [cells[j], cells[k]];
    }
    const emptyN = Math.round(N * N * EMPTY);
    const rest = N * N - emptyN;
    const n1 = Math.floor(rest / 2);
    grid = Array.from({ length: N }, () => Array(N).fill(0));
    cells.forEach((pos, idx) => {
      if (idx < emptyN) return;
      grid[pos[0]][pos[1]] = idx < emptyN + n1 ? 1 : 2;
    });
    renderBoard(false);
  }
  function stepOnce() {
    const t = threshold();
    const unhappy = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      if (grid[r][c] && !happyAt(r, c, t)) unhappy.push([r, c]);
    }
    for (let k = unhappy.length - 1; k > 0; k--) {
      const j = Math.floor(Math.random() * (k + 1));
      [unhappy[k], unhappy[j]] = [unhappy[j], unhappy[k]];
    }
    const empties = emptyList();
    let moved = 0;
    unhappy.forEach(([r, c]) => {
      if (!empties.length) return;
      const j = Math.floor(Math.random() * empties.length);
      const [er, ec] = empties[j];
      grid[er][ec] = grid[r][c];
      grid[r][c] = 0;
      empties[j] = [r, c];
      moved++;
    });
    renderBoard(true);
    return moved;
  }
  function renderBoard() {
    const pad = 2, size = 100 - pad * 2, cell = size / N, rad = cell * 0.36;
    let html = "";
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const x = pad + (c + 0.5) * cell;
      const y = pad + (r + 0.5) * cell;
      if (!grid[r][c]) {
        html += `<circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="${(rad * 0.22).toFixed(2)}" fill="#e8e2d6" />`;
      } else {
        html += `<circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="${rad.toFixed(2)}" fill="${grid[r][c] === 1 ? BLUE : ORANGE}" />`;
      }
    }
    svg.innerHTML = html;
    const s = stats();
    document.getElementById("mUnhappy").textContent = s.occupied ? s.unhappy + " / " + s.occupied : "—";
    document.getElementById("mSeg").textContent = s.occupied ? Math.round(s.seg * 100) + "%" : "—";
    if (playing && s.unhappy === 0) togglePlay(false);
  }
  function resizeBoard() { /* svg scales via viewBox */ }
  function togglePlay(force) {
    if (typeof force === "boolean") playing = force;
    else playing = !playing;
    document.getElementById("btnPlay").textContent = playing ? "暂停" : "自动播放";
    if (timer) { clearInterval(timer); timer = null; }
    if (playing) timer = setInterval(() => { if (!stepOnce()) togglePlay(false); }, 280);
  }
  thr.addEventListener("input", () => {
    document.getElementById("thrVal").textContent = thr.value + "%";
    renderBoard();
  });
  document.getElementById("btnPlay").onclick = () => togglePlay();
  document.getElementById("btnStep").onclick = () => { togglePlay(false); stepOnce(); };
  document.getElementById("btnShuffle").onclick = () => { togglePlay(false); shuffle(); };

  // ----- econ intro module (4 animated interactive slides) -----
  function bindVoteGroup(prefix, count, onPick) {
    const counts = Array(count).fill(0);
    function render(lastIdx) {
      const tot = counts.reduce((a, b) => a + b, 0);
      for (let k = 0; k < count; k++) {
        const pct = tot ? Math.round(counts[k] * 100 / tot) : 0;
        document.getElementById(prefix + "Cnt" + k).textContent = counts[k];
        document.getElementById(prefix + "Pct" + k).textContent = pct + "%";
        document.getElementById(prefix + "Fill" + k).style.width = pct + "%";
        document.getElementById(prefix + "Btn" + k).classList.toggle("active", k === lastIdx);
      }
    }
    for (let k = 0; k < count; k++) {
      document.getElementById(prefix + "Btn" + k).onclick = () => {
        counts[k]++;
        render(k);
        if (onPick) onPick(k, counts);
      };
    }
    return {
      reset() { counts.fill(0); render(-1); },
      counts
    };
  }

  // 1) Scarcity & Opportunity Cost
  const scaItems = [
    { name: "吃喜欢的/买周边", loss: "看电影 / 刷题", poolA: 240 },
    { name: "看电影/打一场球", loss: "吃喜欢的 / 刷题", poolA: 210 },
    { name: "刷题/提前预习", loss: "聚会放松的快乐", poolA: 260 }
  ];
  let scaActive = -1;
  function applyScaFocus(idx) {
    scaActive = idx;
    const beam = document.getElementById("scaBeam");
    if (idx < 0) {
      beam.classList.add("idle");
      beam.style.transform = "";
      document.getElementById("scaGainTxt").textContent = "选中的那一项";
      document.getElementById("scaLossTxt").textContent = "放弃的最好那项";
      document.getElementById("scaBadge").textContent = "点左侧选项看天平怎么倾斜";
      document.getElementById("scaPoolA").setAttribute("width", "195");
      document.getElementById("scaPoolB").setAttribute("x", "340");
      document.getElementById("scaPoolB").setAttribute("width", "195");
      for (let k = 0; k < 3; k++) {
        const g = document.getElementById("scaCard" + k);
        g.querySelector("rect").setAttribute("stroke", "#d6d3d1");
        g.querySelector("rect").setAttribute("fill", "#fff");
        document.getElementById("scaTag" + k).textContent = "点击左侧投票或切换";
        document.getElementById("scaTag" + k).setAttribute("fill", "#57534e");
      }
      return;
    }
    beam.classList.remove("idle");
    beam.style.transform = "rotate(-6deg)";
    const it = scaItems[idx];
    const nextOpp = (idx + 1) % 3;
    document.getElementById("scaGainTxt").textContent = it.name;
    document.getElementById("scaLossTxt").textContent = it.loss;
    document.getElementById("scaBadge").textContent = "已选 " + ["A", "B", "C"][idx] + "：必然放弃其余选项";
    document.getElementById("scaPoolA").setAttribute("width", String(it.poolA));
    document.getElementById("scaPoolB").setAttribute("x", String(145 + it.poolA));
    document.getElementById("scaPoolB").setAttribute("width", String(390 - it.poolA));
    for (let k = 0; k < 3; k++) {
      const g = document.getElementById("scaCard" + k);
      const r = g.querySelector("rect");
      const t = document.getElementById("scaTag" + k);
      if (k === idx) {
        r.setAttribute("stroke", "#0f6e56"); r.setAttribute("fill", "#e8f6f1");
        t.textContent = "✓ 选中获得"; t.setAttribute("fill", "#0f6e56");
      } else if (k === nextOpp) {
        r.setAttribute("stroke", "#c65d1f"); r.setAttribute("fill", "#fff4ec");
        t.textContent = "→ 机会成本（被放弃）"; t.setAttribute("fill", "#c65d1f");
      } else {
        r.setAttribute("stroke", "#e7e0d4"); r.setAttribute("fill", "#faf8f4");
        t.textContent = "同时放弃"; t.setAttribute("fill", "#a8a29e");
      }
    }
  }
  const scaVote = bindVoteGroup("sca", 3, (idx) => applyScaFocus(idx));
  document.getElementById("scaReset").onclick = () => { scaVote.reset(); applyScaFocus(-1); };
  document.getElementById("scaDemo").onclick = () => applyScaFocus((scaActive + 1) % 3);

  // 2) Incentives (Daycare fine)
  const incVote = bindVoteGroup("inc", 3);
  function setIncRevealed(on) {
    document.getElementById("incMask").style.display = on ? "none" : "block";
    document.getElementById("incActiveAnim").setAttribute("opacity", on ? "1" : "0.18");
    document.getElementById("incRightFoot").textContent = on ? "内疚消失，迟到人数翻倍！" : "结果待揭晓…";
    document.getElementById("incLine").style.strokeDashoffset = on ? "0" : "620";
    document.getElementById("incLineTip").style.display = on ? "none" : "block";
    document.getElementById("incBadge").textContent = on ? "真实结果：罚款反而让迟到翻倍" : "先投票，再揭晓";
    document.getElementById("incNote").innerHTML = on
      ? "<strong>真实实验结果：</strong>开始罚款后迟到<strong>直接翻倍</strong>；第 17 周取消罚款，迟到也没降回去！因为 10 元把「道德内疚」换成了「花钱买服务」。"
      : "先让学生凭直觉投票，再点<strong>「揭晓真实实验结果」</strong>，看右侧两幅动图发生了什么。";
  }
  document.getElementById("incReveal").onclick = () => setIncRevealed(true);
  document.getElementById("incReset").onclick = () => { incVote.reset(); setIncRevealed(false); };
  setIncRevealed(false);

  // 3) Market coordination particle flow
  const mktVote = bindVoteGroup("mkt", 2);
  const mktBox = document.getElementById("mktParticles");
  const MKT_N = 32;
  const mktDots = Array.from({ length: MKT_N }, (_, k) => ({
    lane: k % 2, // 0=A, 1=B
    x: 92 + (k * 15) % 496,
    dy: ((k * 7) % 5 - 2) * 9,
    r: 6.5
  }));
  let mktPhase = "init"; // init | shock
  let mktElapsed = 0;
  let mktRaf = null;
  let mktLastTs = 0;

  function setMktMode(mode) {
    mktPhase = mode;
    mktElapsed = 0;
    if (mode === "init") {
      mktDots.forEach((d, k) => { d.lane = k % 2; });
      document.getElementById("mktBadge").textContent = "初始状态：A、B 各走一半";
    } else {
      document.getElementById("mktBadge").textContent = "动态模拟：A 修宽 → 拥堵 → 自动分流";
    }
  }
  document.getElementById("mktTrigger").onclick = () => setMktMode("shock");
  document.getElementById("mktInit").onclick = () => setMktMode("init");
  document.getElementById("mktReset").onclick = () => { mktVote.reset(); setMktMode("init"); };

  function mktStep(ts) {
    const dt = mktLastTs ? Math.min(0.05, (ts - mktLastTs) / 1000) : 0.016;
    mktLastTs = ts;
    mktElapsed += dt;

    const countA = mktDots.filter((d) => d.lane === 0).length;
    const countB = MKT_N - countA;
    // A road widened -> higher capacity (1.42x)
    const capA = mktPhase === "shock" ? 1.42 : 1.0;
    const densA = countA / capA;
    const densB = countB;
    const speedA = Math.max(36, 178 * capA - countA * 4.5);
    const speedB = Math.max(36, 178 - countB * 4.5);

    const calcTime = (d) => Math.max(7, Math.round(5 + d * 0.42 + (d > 15 ? (d - 15) * 2.2 : 0)));
    const timeA = mktPhase === "init" ? 12 : calcTime(densA);
    const timeB = mktPhase === "init" ? 12 : calcTime(densB);

    // Negative feedback route choice after initial surge
    let targetShareA = 0.5;
    if (mktPhase === "shock") {
      if (mktElapsed < 3.6) targetShareA = 0.92;
      else targetShareA = densA < densB - 0.6 ? 0.88 : (densA > densB + 0.6 ? 0.16 : 0.59);
    }

    mktDots.forEach((d) => {
      d.x += (d.lane === 0 ? speedA : speedB) * dt;
      if (d.x > 586) {
        d.x = 92;
        d.lane = Math.random() < targetShareA ? 0 : 1;
      }
    });

    // Render SVG particles
    const congestedA = mktPhase === "shock" && countA >= 22;
    let html = "";
    mktDots.forEach((d) => {
      const cy = (d.lane === 0 ? 105 : 249) + d.dy;
      const col = d.lane === 0 ? (congestedA ? "#b42318" : "#2c6e9e") : "#0f6e56";
      html += `<circle cx="${d.x.toFixed(1)}" cy="${cy.toFixed(1)}" r="${d.r}" fill="${col}" opacity="0.9"/>`;
    });
    mktBox.innerHTML = html;

    // Update dashboard
    const roadA = document.getElementById("mktRoadA");
    const barA = document.getElementById("mktBarA");
    const barB = document.getElementById("mktBarB");
    roadA.setAttribute("fill", congestedA ? "#fdecec" : "#f3f7fa");
    roadA.setAttribute("stroke", congestedA ? "#b42318" : "#2c6e9e");
    document.getElementById("mktTagA").textContent = congestedA ? "（挤爆拥堵！）" : (mktPhase === "shock" ? "（修宽后顺畅）" : "（顺畅）");
    document.getElementById("mktTagA").setAttribute("fill", congestedA ? "#b42318" : "#0f6e56");
    document.getElementById("mktTimeA").textContent = timeA + " 分钟";
    document.getElementById("mktTimeB").textContent = timeB + " 分钟";
    document.getElementById("mktBarTxtA").textContent = timeA + " 分";
    document.getElementById("mktBarTxtB").textContent = timeB + " 分";
    barA.setAttribute("width", String(Math.min(370, timeA * 15)));
    barA.setAttribute("fill", congestedA ? "#b42318" : "#2c6e9e");
    barB.setAttribute("width", String(Math.min(370, timeB * 15)));

    const st = document.getElementById("mktStatus");
    if (mktPhase === "init") {
      st.textContent = "当前：各走一半，两条路耗时自动拉平（无总指挥的均衡）";
      st.setAttribute("fill", "#0b4f3d");
    } else if (!congestedA && mktElapsed < 4.0) {
      st.textContent = "第 1 步：A 路修宽更快，大家纷纷改道挤向 A 路…";
      st.setAttribute("fill", "#2c6e9e");
    } else if (congestedA) {
      st.textContent = "第 2 步：A 路已经堵成红灯！新来的人看见耗时飙升，开始改回 B 路";
      st.setAttribute("fill", "#b42318");
    } else if (mktElapsed < 8.5) {
      st.textContent = "第 2 步：信号发挥作用，车流自动向 B 路分流平衡";
      st.setAttribute("fill", "#c65d1f");
    } else {
      st.textContent = "第 3 步：没人指挥，两条路耗时再次自动拉平（约 " + timeA + " 分），达成新均衡！";
      st.setAttribute("fill", "#0b4f3d");
    }
    mktRaf = requestAnimationFrame(mktStep);
  }
  function mktLoop(active) {
    if (active && !mktRaf) { mktLastTs = 0; mktRaf = requestAnimationFrame(mktStep); }
    if (!active && mktRaf) { cancelAnimationFrame(mktRaf); mktRaf = null; }
  }

  // 4) Collective dilemma (Concert standing)
  const colVote = bindVoteGroup("col", 2);
  let stood = [true, false, false, false, false];
  let colTimers = [];
  function renderConcert() {
    const g = document.getElementById("colRows");
    let html = "";
    for (let idx = 0; idx < 5; idx++) {
      const x = 165 + idx * 96;
      const isUp = stood[idx];
      const blocked = !isUp && idx > 0 && stood[idx - 1];
      const yShift = isUp ? -46 : 0;
      const headY = 266 + yShift;
      const col = isUp ? (idx === 0 ? "#0f6e56" : "#c65d1f") : (blocked ? "#b42318" : "#2c6e9e");
      // Seat
      html += `<rect x="${x - 16}" y="318" width="32" height="42" rx="6" fill="#e7e0d4" stroke="#a8a29e" stroke-width="1.5"/>`;
      // Person body + head
      html += `<g style="transition:transform .42s cubic-bezier(.22,1,.36,1);">`;
      html += `<rect x="${x - 14}" y="${headY + 18}" width="28" height="48" rx="10" fill="${col}"/>`;
      html += `<circle cx="${x}" cy="${headY}" r="15" fill="${col}"/>`;
      html += `<text x="${x}" y="${headY + 5}" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">${idx + 1}</text>`;
      html += `</g>`;
      // Sightline to stage
      if (isUp) {
        const allClear = idx === 0 || !stood[idx - 1];
        const lineCol = allClear ? "#0f6e56" : "#c65d1f";
        const targetX = idx === 0 ? 112 : x - 62;
        html += `<line x1="${x - 16}" y1="${headY}" x2="${targetX}" y2="${idx === 0 ? 170 : headY}" stroke="${lineCol}" stroke-width="3" stroke-dasharray="${allClear ? "" : "5 4"}"/>`;
      } else if (blocked) {
        html += `<line x1="${x - 16}" y1="${headY}" x2="${x - 76}" y2="${headY}" stroke="#b42318" stroke-width="3" stroke-dasharray="4 4"/>`;
        html += `<text x="${x}" y="${headY - 22}" text-anchor="middle" font-size="13" font-weight="800" fill="#b42318">被挡!</text>`;
      } else {
        html += `<line x1="${x - 16}" y1="${headY}" x2="112" y2="210" stroke="#2c6e9e" stroke-width="2.5" stroke-dasharray="6 4"/>`;
      }
      if (isUp) {
        const msg = idx === 0 ? "真清楚!" : "被迫站起";
        html += `<rect x="${x - 32}" y="${headY - 40}" width="64" height="22" rx="8" fill="${idx === 0 ? "#e8f6f1" : "#fff4ec"}" stroke="${col}" stroke-width="1.2"/>`;
        html += `<text x="${x}" y="${headY - 25}" text-anchor="middle" font-size="12" font-weight="700" fill="${col}">${msg}</text>`;
      }
    }
    g.innerHTML = html;

    const upCnt = stood.filter(Boolean).length;
    const allUp = upCnt === 5;
    document.getElementById("colBadge").textContent = allUp ? "全员站起：白费力气" : ("第 1～" + upCnt + " 排站起");
    document.getElementById("colBannerTxt").textContent = allUp
      ? "结局：5 排全部站起——每个人一样累，视野却没比原来更清楚！"
      : (upCnt === 1 ? "初始：第 1 排站起视野变好，后 4 排视线全被挡住" : "连锁反应：第 " + upCnt + " 排为了看清，也不得不站起来…");
    document.getElementById("colBannerBox").setAttribute("fill", allUp ? "#fff4ec" : "#eef5fb");
    document.getElementById("colBannerBox").setAttribute("stroke", allUp ? "#c65d1f" : "#2c6e9e");
    document.getElementById("colBannerTxt").setAttribute("fill", allUp ? "#c65d1f" : "#2c6e9e");
    document.getElementById("colResTxt").textContent = allUp ? "累了 · 视野还是 100%" : (upCnt + " 排站起 · " + (5 - upCnt) + " 排受影响");
  }
  function clearColTimers() { colTimers.forEach(clearTimeout); colTimers = []; }
  document.getElementById("colPlay").onclick = () => {
    clearColTimers();
    stood = [true, false, false, false, false];
    renderConcert();
    [1, 2, 3, 4].forEach((rowIdx, step) => {
      colTimers.push(setTimeout(() => { stood[rowIdx] = true; renderConcert(); }, (step + 1) * 550));
    });
  };
  document.getElementById("colSit").onclick = () => {
    clearColTimers();
    stood = [true, false, false, false, false];
    renderConcert();
  };
  document.getElementById("colReset").onclick = () => { colVote.reset(); document.getElementById("colSit").click(); };
  renderConcert();

  // Finale MVP vote & live class summary
  const mLikes = [0, 0, 0, 0];
  function renderLikes() {
    const mx = Math.max(...mLikes);
    for (let k = 0; k < 4; k++) {
      document.getElementById("mCnt" + k).textContent = mLikes[k];
      document.getElementById("mCard" + k).classList.toggle("mvp", mx > 0 && mLikes[k] === mx);
    }
  }
  for (let k = 0; k < 4; k++) {
    document.getElementById("mLike" + k).onclick = () => { mLikes[k]++; renderLikes(); };
  }
  document.getElementById("mReset").onclick = () => { mLikes.fill(0); renderLikes(); };

  function updateFinale() {
    if (nums.length) {
      const avg = nums.reduce((a, b) => a + b, 0) / nums.length;
      const target = avg * 2 / 3;
      document.getElementById("clRec0").textContent =
        "本班刚才战绩：" + nums.length + " 人参与，平均数 " + fmt(avg) + "，获胜目标 " + fmt(target);
    }
    const hTot = hookVotes[0].yes + hookVotes[0].no + hookVotes[1].yes + hookVotes[1].no;
    if (uRows.length) {
      const avg = uRows.reduce((a, r) => a + r.offer, 0) / uRows.length;
      const rej = uRows.filter((r) => !r.accept).length;
      document.getElementById("clRec2").textContent =
        "本班刚才战绩：" + uRows.length + " 组交锋，平均分给同伴 " + fmt(avg) + " 个代币，拒绝 " + rej + " 次";
    } else if (hTot > 0) {
      document.getElementById("clRec2").textContent =
        "本班刚才战绩：丢票愿再买 " + hookVotes[0].yes + " 人 vs 丢钱愿再买 " + hookVotes[1].yes + " 人";
    }
    const s = stats();
    if (s.occupied) {
      document.getElementById("clRec3").textContent =
        "本班刚才棋盘：相似要求 " + thr.value + "% 时，邻居相似率达到 " + Math.round(s.seg * 100) + "%";
    }
  }

  function syncEconSlides(id) {
    mktLoop(id === "econ-market");
    if (id === "close") updateFinale();
  }

  shuffle();
  const startHash = location.hash.replace(/^#/, "");
  const start = slides.findIndex((s) => s.dataset.id === startHash);
  show(start >= 0 ? start : 0);
})();
</script>
</body>
</html>
