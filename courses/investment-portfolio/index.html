<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>投资组合 · 课程中心</title>
  <meta name="description" content="投资组合理论与实践入门。">
  <script src="../../assets/theme.js"></script>
  <link rel="stylesheet" href="../../assets/site.css?v=20">
  <style>
    .page-hero {
      padding: 56px 0 32px;
      border-bottom: 1px solid var(--line-strong);
    }

    .page-hero .eyebrow {
      margin-bottom: 14px;
    }

    .page-hero h1 {
      margin: 0;
      font-family: var(--display);
      font-size: clamp(40px, 5.5vw, 56px);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -0.02em;
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    .breadcrumb a {
      color: var(--muted);
      text-decoration: none;
      transition: color 180ms ease;
    }

    .breadcrumb a:hover {
      color: var(--accent);
    }

    .breadcrumb .sep {
      opacity: 0.5;
    }

    .breadcrumb .current {
      color: var(--ink);
    }

    .hero-submit {
      margin: 18px 0 0;
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .hero-submit a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1.5px solid var(--accent);
      padding-bottom: 1px;
      transition: opacity 180ms ease;
    }

    .hero-submit a:hover {
      opacity: 0.75;
    }

    .page-content {
      padding: 40px 0 72px;
    }

    /* 页面卡片网格 */
    .page-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
    }

    .page-card {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 22px 20px 16px;
      min-height: 130px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      color: inherit;
      text-decoration: none;
      transition: border-color 200ms ease;
    }

    .page-card:hover {
      border-color: var(--accent);
    }

    .page-card .page-tag {
      align-self: flex-start;
      padding: 3px 9px;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border-radius: 999px;
      background: var(--surface-soft);
      color: var(--accent);
    }

    .page-card h3 {
      margin: 0;
      font-family: var(--display);
      font-size: 19px;
      font-weight: 700;
      line-height: 1.3;
      color: var(--ink);
    }

    .page-card p {
      margin: 0;
      color: var(--text);
      font-size: 13.5px;
      line-height: 1.65;
    }

    .page-card .page-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--accent);
    }

    .page-card .page-arrow {
      font-size: 14px;
      transition: transform 180ms ease;
    }

    .page-card:hover .page-arrow {
      transform: translateX(3px);
    }

    .page-card.is-coming {
      background: transparent;
      border-style: dashed;
      border-color: var(--line-strong);
      cursor: default;
    }

    .page-card.is-coming:hover {
      border-color: var(--line-strong);
    }

    .page-card.is-coming h3,
    .page-card.is-coming p,
    .page-card.is-coming .page-meta {
      color: var(--muted);
    }

    .page-card.is-coming .page-meta {
      border-top-color: var(--line);
    }

    @media (max-width: 760px) {
      .page-hero {
        padding: 40px 0 24px;
      }

      .page-hero h1 {
        font-size: 36px;
      }

      .page-content {
        padding: 28px 0 48px;
      }

      .page-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body class="home-page">
  <header class="site-header">
    <nav class="site-nav" aria-label="主导航">
      <div class="container nav-inner">
        <a class="site-brand" href="../../">张剑 <span>/ Jian Zhang</span></a>
        <div class="nav-links">
          <a href="../../">首页</a>
          <a href="../../cv/">个人简历</a>
          <a href="../" aria-current="page">课程中心</a>
          <a href="../../knowledge/">知识学习</a>
          <a href="https://jefeerzh.github.io" target="_blank" rel="noopener">个人学习站</a>
          <button type="button" class="theme-toggle" id="theme-toggle" aria-label="切换主题">
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.9 4.9l1.4 1.4"/><path d="M17.7 17.7l1.4 1.4"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M4.9 19.1l1.4-1.4"/><path d="M17.7 6.3l1.4-1.4"/></svg>
          </button>
        </div>
      </div>
    </nav>
  </header>

  <main id="main-content">

    <section class="page-hero">
      <div class="container">
        <nav class="breadcrumb" aria-label="面包屑">
          <a href="../">课程中心</a>
          <span class="sep">/</span>
          <a href="../#undergraduate">本科课程</a>
          <span class="sep">/</span>
          <span class="current">投资组合</span>
        </nav>
        <p class="eyebrow">Investment Portfolio · 本科专题</p>
        <h1>投资组合</h1>
        <p class="hero-submit">
          <a href="https://send2me.cn/s6scThjh/S7uneaqptLkaHg" target="_blank" rel="noopener">作业提交地址 →</a>
        </p>
      </div>
    </section>

    <section class="page-content">
      <div class="container">
        <div class="page-grid">

          <div class="page-card is-coming" aria-disabled="true">
            <span class="page-tag">筹备中</span>
            <h3>第 01 讲</h3>
            <p>待补充。</p>
            <div class="page-meta">
              <span>即将上线</span>
            </div>
          </div>

        </div>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>由 GitHub Pages 托管</span>
      <div class="footer-links">
        <a href="https://github.com/jefeerzhang" target="_blank" rel="noopener">GitHub</a>
        <a href="https://orcid.org/0000-0002-8024-5483" target="_blank" rel="noopener">ORCID</a>
      </div>
    </div>
  </footer>

<script>
  (function () {
    var btn = document.getElementById('theme-toggle');
    if (!btn || !window.Theme) return;
    btn.addEventListener('click', function () { window.Theme.toggle(); });
  })();
</script>
</body>
</html>
