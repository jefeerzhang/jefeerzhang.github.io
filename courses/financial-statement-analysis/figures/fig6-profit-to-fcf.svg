<line x1="40" y1="340" x2="720" y2="340" stroke="#52606d" stroke-width="1.4"/>
<path d="M478 140 H486 V200 H478" fill="none" stroke="#1f2933" stroke-width="1.4"/>
<text x="494" y="166" style="font-size:13px;font-weight:700">应计项目</text>
<text x="494" y="185" style="font-size:12px;fill:#52606d">＝ 净利润 − 经营现金流</text>
<g text-anchor="middle">
<text class="l1" x="100" y="362">净利润</text>
<text class="l1" x="210" y="362">+ 非现金费用</text><text class="l2" x="210" y="380">折旧、摊销、减值</text>
<text class="l1" x="320" y="362">− 营运资本增加</text><text class="l2" x="320" y="380">应收、存货等增加</text>
<text class="l1" x="430" y="362">经营活动</text><text class="l1" x="430" y="380">现金净流量</text>
<text class="l1" x="540" y="362">− 资本性支出</text><text class="l2" x="540" y="380">购建长期经营资产</text>
<text class="l1" x="650" y="362">自由现金流</text>
</g>
<text x="720" y="30" text-anchor="end" style="font-size:12px;fill:#7b8794">示意图：柱高仅表示增减方向与相对关系</text>
</svg>
