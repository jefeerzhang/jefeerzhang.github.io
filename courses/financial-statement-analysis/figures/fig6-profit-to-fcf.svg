<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410">
<style>
text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC","Source Han Sans SC",sans-serif;fill:#1f2933}
.l1{font-size:13px;font-weight:700}
.l2{font-size:12px;fill:#52606d}
</style>
<rect width="760" height="410" fill="#ffffff"/>
<line x1="140" y1="140" x2="482" y2="140" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="4 4"/>
<g stroke="#9aa5b1" stroke-width="1" stroke-dasharray="3 3">
<line x1="250" y1="60" x2="280" y2="60"/>
<line x1="360" y1="200" x2="390" y2="200"/>
<line x1="470" y1="200" x2="500" y2="200"/>
<line x1="580" y1="300" x2="610" y2="300"/>
</g>
<rect x="60" y="140" width="80" height="200" fill="#1f4e79"/>
<rect x="170" y="60" width="80" height="80" fill="#cfe0f1" stroke="#1f4e79" stroke-width="1.4"/>
<rect x="280" y="60" width="80" height="140" fill="#f6dfc0" stroke="#9c5b16" stroke-width="1.4"/>
<rect x="390" y="200" width="80" height="140" fill="#1f4e79"/>
<rect x="500" y="200" width="80" height="100" fill="#f6dfc0" stroke="#9c5b16" stroke-width="1.4"/>
