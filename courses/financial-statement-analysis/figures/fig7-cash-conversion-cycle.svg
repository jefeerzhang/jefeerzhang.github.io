<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290">
<style>
text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC","Source Han Sans SC",sans-serif;fill:#1f2933}
.ev{font-size:13px;font-weight:700}
.sp{font-size:13px}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker>
</defs>
<rect width="760" height="290" fill="#ffffff"/>
<g stroke="#c3cad3" stroke-width="1" stroke-dasharray="3 4">
<line x1="100" y1="70" x2="100" y2="114"/><line x1="420" y1="70" x2="420" y2="114"/><line x1="640" y1="70" x2="640" y2="114"/>
<line x1="100" y1="152" x2="100" y2="185"/><line x1="300" y1="152" x2="300" y2="235"/><line x1="640" y1="152" x2="640" y2="235"/>
</g>
<line x1="50" y1="145" x2="715" y2="145" stroke="#52606d" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="722" y="149" style="font-size:12px;fill:#52606d">时间</text>
<g fill="#1f2933"><circle cx="100" cy="145" r="5"/><circle cx="300" cy="145" r="5"/><circle cx="420" cy="145" r="5"/><circle cx="640" cy="145" r="5"/></g>
<g class="ev" text-anchor="middle">
<text x="100" y="130">采购入库</text><text x="300" y="130">支付货款</text><text x="420" y="130">实现销售</text><text x="640" y="130">收回货款</text>
</g>
<g stroke="#1f4e79" stroke-width="2.2" fill="none">
<path d="M100 70 H420 M100 64 V76 M420 64 V76"/>
<path d="M420 70 H640 M640 64 V76"/>
</g>
<text class="sp" x="260" y="58" text-anchor="middle" style="fill:#1f4e79">存货周转天数</text>
<text class="sp" x="530" y="58" text-anchor="middle" style="fill:#1f4e79">应收账款周转天数</text>
<path d="M100 185 H300 M100 179 V191 M300 179 V191" stroke="#9c5b16" stroke-width="2.2" fill="none"/>
<text class="sp" x="200" y="207" text-anchor="middle" style="fill:#9c5b16">应付账款周转天数</text>
<path d="M300 235 H640 M300 228 V242 M640 228 V242" stroke="#1f2933" stroke-width="3" fill="none"/>
<text class="sp" x="470" y="260" text-anchor="middle" style="font-weight:700">现金转换周期 = 存货周转天数 + 应收账款周转天数 − 应付账款周转天数</text>
</svg>
