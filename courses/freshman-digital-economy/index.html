      font-weight: 700;

    .page-card h3 {

      font-family: var(--display);
      font-size: 19px;
      font-weight: 700;
      line-height: 1.3;
      color: var(--ink);

    .page-card p {
      margin: 0;
      color: var(--text);
      font-size: 13.5px;
      line-height: 1.65;
    }

    .page-card .page-meta {

      align-items: center;
      justify-content: space-between;

      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--accent);
    }

    .page-card .page-arrow {
      font-size: 14px;
      transition: transform 180ms ease;
    }

    .page-card:hover .page-arrow {
      transform: translateX(3px);
    }

    .page-card.opening-card {
      background: linear-gradient(135deg, #0e131c 0%, #1a2130 100%);
      border-color: #2a3446;
      color: #e8edf5;
      grid-column: 1 / -1;
    }
    .page-card.opening-card:hover {
      border-color: #4caf50;
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(76,175,80,.14);
    }
    .page-card.opening-card .page-tag {
