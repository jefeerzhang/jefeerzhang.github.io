# =============================================================
# 站点结构总纲(Site Manifest)
# 维护:张剑
# 生效:2026-07-12
# 作用:让 AI/我每次改站都照这份清单执行,杜绝"结构每次都不一样"
# =============================================================

# ---------- AI 阅读须知(每次接到网站任务先看这段) ----------
# 接到"改站 / 加子站 / 调样式 / 写文案"这类任务,请按以下顺序:
#   1. 读 `theme.palette` + `theme.rule`:知道能用什么色 / 什么字体 / 什么禁条
#   2. 读 `nav` + `sections`:知道顶层有哪几个栏目,目录路径是什么
#   3. 读 `sections` 里 knowledge 的 columns:挂新子站照 `shells.knowledge-shell` 的外壳写
#   4. 读 `knowledge_mount`:挂载步骤与卡片格式以它为准
#   5. 写文案读 `copy_discipline`;改样式读 `theme.rule`
# 铁律:
#   - 不准删本文件的 key;新增 key 在最后追加
#   - 不准自己改 `accent` 色 / 字体栈;要改先问张剑
#   - 改完任何 html 后,按 `workflow.verify` 段的工具与地址两条验真
#   - commit 信息格式:`feat|fix|style|docs(scope): 中文说明`

site:
  domain: jefeerzhang.github.io
  repo: jefeerzhang/jefeerzhang.github.io
  branch: master
  deploy: GitHub Pages
  owner_email: zhangjian@sicau.edu.cn
  wechat: jefeerzhang

# -------------------------------------------------------------
# 一、配色(学术极简 · master-course 同款)
# -------------------------------------------------------------
theme:
  # 2026-10-11 查证:huashu-design 与 taste_skill_sop 这两个技能在本机不存在。
  # 视觉细则以 theme.rule 与 assets/site.css 为准;文案细则以 copy_discipline 为准。
  style_skill: 已废弃,原值 huashu-design,改看 theme.rule 与 assets/site.css
  palette:
    paper:    "#f2f5f2"     # 页面主背景,米白偏绿
    surface:  "#fbfcfb"     # 卡片底
    surface_soft: "#f1ede4" # 卡片 hover/分隔区
    surface_deep: "#e8e2d4" # 重点分隔区
    accent:   "#245642"     # 深绿(按钮/标题/边框)
    accent_hover: "#173e2f"
    accent_ink: "#f6fbf8"
    text:     "#4c5b53"     # 正文色
    ink:      "#1a1817"     # 标题/重点色
    muted:    "#6b6b66"     # 副文本
    line:     "#e5e2dc"     # 细线
    line_strong: "#b9c8be"  # 强分隔线
  font:
    serif:   '"Source Han Serif SC", "Songti SC", "Noto Serif CJK SC", STSong, Georgia, serif'
    display: '"Source Han Serif SC", "Songti SC", Newsreader, "EB Garamond", "Source Serif 4", "Noto Serif CJK SC", STSong, Georgia, serif'
    sans:    'Inter, "Geist", "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif'
    mono:    '"JetBrains Mono", "Cascadia Mono", SFMono-Regular, Consolas, monospace'
    note: 标题统一走 display 栈,西文 Newsreader 优先,中文 Noto Serif CJK SC fallback
  container_max_width: 1180px
  radius: 8px
  rule:
    no_gradient: true
    no_shadow_card: true
    circle_radius: 2px   # 极个别圆形元素(如头像)用,普通卡片仍 8px
  design_discipline: 已废弃,原值 taste_skill_sop,改看 copy_discipline

# -------------------------------------------------------------
# 二、导航(全站主入口,5 项)
#   2026-10-11 已核:19 个含导航的页面(顶层 5 页 + 子页)5 项全一致,顺序即下。
# -------------------------------------------------------------
nav:
  - id: home
    label: 首页
    path: /
    file: index.html
  - id: cv
    label: 个人简历
    path: /cv/
    file: cv/index.html
  - id: courses
    label: 课程中心
    path: /courses/
    file: courses/index.html
  - id: knowledge
    label: 知识学习
    path: /knowledge/
    file: knowledge/index.html
  - id: tools
    label: 小工具
    path: /tools/
    file: tools/index.html

# master-course 在另一个仓库,这里只做外链
external_links:
  - id: master_course
    label: 硕士课程
    url: https://jefeerzhang.github.io/master-course/

# -------------------------------------------------------------
# 三、栏目(全站顶层目录)
#   每栏目 = 一个子站/页面集合,各栏目下必须有自己的 index.html
#   卡片样式遵循 knowledge/index.html 的 column-card / section-card
# -------------------------------------------------------------
sections:
  - id: knowledge
    path: /knowledge/
    intro: 按主题整理的系列学习专栏,涵盖研究方法、实证分析等内容。每个专栏自成体系,由浅入深。
    layout: column-grid           # 卡片栅格
    columns:
      # 2026-10-11 与 knowledge/index.html 的卡片逐张核对,顺序也照它
      - id: ai-biancheng
        url: https://aiolaola.com/course
        external: true
        title: 从零学会 AI 编程
        summary: 10 大阶段、182 节课,从"什么是文件"到"用 AI 做出真东西",前 2 章 21 节免登录试看。
        tag: 推荐 · 零基础首选
        meta: 外部课程 · 10 阶段 182 节 · 零基础 → 能动手
        status: live
        featured: true            # 在 knowledge/index.html 里置顶、独占一行
      - id: python-course
        path: /knowledge/python-course/
        title: Python 语言基础与应用
        summary: 面向零基础大学生的 142 节 Python 课,每节结构一致:比喻导入、概念讲解、课堂代码到随堂测验。
        tag: 新专栏
        meta: 8 章节 · 142 知识点 · 零基础 → 能动手
        shell: knowledge-shell
        status: live
        featured: true            # 与 ai-biancheng 同为首行置顶卡
      - id: datawhale-ai
        url: https://www.datawhale.cn/learn/summary/40
        external: true
        title: Datawhale 人工智能
        summary: 按 NLP、推荐系统、CV、大数据、数据分析五个方向编排的课程地图。
        meta: 外部课程 · 5 个方向 · 基础 → 实践
        status: live
      - id: jiliang-fangfa
        path: /knowledge/jiliang-fangfa/
        title: 计量方法 · Stata 实操
        summary: 用 Stata 把因果推断的每一步跑通,从设计选择到诊断细节。
        tag: 最新专栏
        meta: 1 篇讲稿 · DID 专题 · 入门 → 实战
        shell: knowledge-shell
        status: live
      - id: ai-learning-methods
        path: /knowledge/ai-learning-methods.html
        title: AI 时代的学习方法
        summary: AI 辅助学习的操作流程图,单页。
        meta: 流程图 · 单页
        shell: none
        status: live
      - id: git-guide
        url: https://www.runoob.com/manual/git-guide/
        external: true
        title: Git 简明指南
        summary: Git 基本工作流速查,含添加提交、分支管理、更新合并与标签。
        meta: 外部资源 · 速查手册
        status: live
      - id: fsqca
        path: /knowledge/fsqca/
        title: fsQCA 模糊集定性比较分析
        summary: 从 QCA 是什么到开题报告写作。
        meta: 6 节 · 入门 → 实战
        shell: knowledge-shell
        status: live
      - id: zhang-gen-li-lun
        path: /knowledge/zhang-gen-li-lun/
        title: 扎根理论 · 系统学习
        summary: 从访谈观察到编码与理论整合。
        meta: 12 节 + 7 篇辅助 · 入门 → 实战
        shell: knowledge-shell
        status: live
      - id: wenjuan-sheji
        path: /knowledge/wenjuan-sheji/
        title: 问卷设计 · 系统课程
        summary: 从研究问题到可审查的问卷研究。
        meta: 11 节 + 5 份参考 · 入门 → 实战
        shell: knowledge-shell
        status: live
      - id: ai-course
        path: /knowledge/ai-course/
        title: AI 入门课程
        summary: 基于 Microsoft《AI-For-Beginners》中文版改编,12 节短课入门人工智能。
        meta: 12 节 + Notebook · 入门 → 高级
        shell: knowledge-shell
        status: live
      - id: abms
        path: /knowledge/abms/
        title: ABMS 基于主体的建模
        summary: 从什么是 ABM 到模型验证方法论,讲解 Agent-Based Modeling 的核心概念、经典模型与实践工具。
        meta: 8 节 · 入门 → 实战
        shell: knowledge-shell
        status: live

  - id: tools
    path: /tools/
    intro: 学术研究常用的小工具合集。
    layout: tool-grid
    items: []   # 由 tools/index.html 维护,这里只占位

  - id: cv
    path: /cv/
    intro: 个人学术简历
    file: cv/index.html
    style: cv-page               # cv 页有独立 CV 段落样式

  # 2026-10-11 补:nav 已有「课程中心」,sections 原先漏了它,此处补齐。
  - id: courses
    path: /courses/
    intro: 按硕士与本科两层组织的课程中心,课程多指向站外 master-course。
    file: courses/index.html
    levels: [graduate, undergraduate]   # 页内 tab 切换硕士 / 本科
    style: courses-page          # courses 页有 tab 切换与独立课程组样式

# -------------------------------------------------------------
# 四、知识库子页统一外壳(knowledge-shell)
#   任何 knowledge 下的子页必须按这个结构套,杜绝"每个子站结构都不一样"
#   约定:保留原 inline <style>;不引入 <main> 嵌套
# -------------------------------------------------------------
shells:
  knowledge-shell:
    block_order:
      - site-header               # 顶部主导航(全站统一)
      - breadcrumb                # 面包屑
      - lesson-hero               # 课程头(eyebrow + 中文 h1 + 一句话总述)
      - main                      # 原文件 <body> 内主体(保留 inline style)
      - lesson-nav                # 上/下一课导航
      - site-footer               # 全站统一页脚
    breadcrumb_format: "{父栏目} / {子站名} / 第 N 课"
    hero_template:
      eyebrow: "LESSON {NN}"
      h1: "{课名}"
      subtitle: "{一句话总述,3-15 字}"
    lesson_nav:
      required: true
      prev_label: "← 上一课"
      next_label: "下一课 →"

# -------------------------------------------------------------
# 五、文案纪律(去 AI 味,stop_ai_slop_zh_sop 落地)
#   每次新增/修改任何中文文案,必须遵守;AI 违规即打回
# -------------------------------------------------------------
copy_discipline:
  style: stop_ai_slop_zh_sop
  hard_rules:
    - id: no_em_dash
      rule: 全站禁用 em-dash(—),改用 → 或 , 或句号
    - id: no_ai_cliche
      forbid: [赋能, 至关重要, 不容忽视, 时代呼唤, 让我们一起, 值得一提的是,
               综上所述, 由此可见, 毫无疑问, 在此背景下, 不可或缺, 深度赋能]
    - id: specific_numbers
      rule: 凡是"课程数/章节数/课时数",必须写具体数字(如 12 节、7 篇),禁"多/一些/若干"
    - id: card_meta_arrow
      rule: 'card 角标使用 → 而非 - 或 ~ (例: "12 节 + 7 篇 · 入门 → 实战")'

# -------------------------------------------------------------
# 六、改站流程(每次 AI 接站,必须按此顺序)
# -------------------------------------------------------------
workflow:
  steps:
    - read site.yml              # 先读总纲
    # 原先此处还要求读 jefeerzhang_site.md / taste_skill_sop.md / stop_ai_slop_zh_sop.md。
    # 2026-10-11 查证:这三份文件在本机与仓库都不存在,规则已内联进本文件的
    # theme.rule / theme.design_discipline / copy_discipline,故不再单列。
    - 修改
    - git commit + push master
    - curl 远端 raw 验真
  verify:
    tool: curl.exe --noproxy '*' --max-time 15
    raw_url: https://raw.githubusercontent.com/jefeerzhang/jefeerzhang.github.io/master
    pages_url: https://jefeerzhang.github.io
    note: 加 /index.html 或具体 html 避免 GitHub Pages 自定义 404

# -------------------------------------------------------------
# 七、知识库子站挂载标准流程(给 AI 的操作清单)
#   用户只需说: "把 XXX 文件夹挂到 knowledge 下,叫 YYY"
#   AI 按以下步骤执行,不问不猜
# -------------------------------------------------------------
knowledge_mount:
  description: |
    用户给一个本地文件夹(含若干 HTML),挂到 /knowledge/{slug}/ 下。
    index.html 作为接入页(加导航栏),其余子页原样保留。
  input:
    folder: "本地文件夹绝对路径"
    slug: "英文短横线目录名,如 zhang-gen-li-lun"
    title: "中文标题,用于知识库卡片"
    summary: "一句话描述,用于知识库卡片"
    tag: "分类标签,如 研究方法"
    meta: "附加信息,如 12 节核心 + 7 篇辅助 · 入门 → 实战"
  steps:
    - step: 1
      name: 拷贝文件
      action: "把文件夹内所有 HTML 复制到 site_clone/knowledge/{slug}/"
      note: 先删目标目录旧文件(如有)
    - step: 2
      name: index.html 加导航
      action: |
        只给 index.html 加:
          1. <head> 内 </style> 后加 <link rel="stylesheet" href="../../assets/site.css">
          2. <body> 后加 site-header(5 链接:首页/个人简历/知识学习{active}/个人学习站/硕士课程)
          3. </body> 前加 site-footer(版权+不蒜子+busuanzi.js)
      note: 其他子页不动,保留素材原样
    - step: 3
      name: 更新 site.yml
      action: "在 sections[0](knowledge).columns 末尾追加新条目"
      template: |
        - id: {slug}
          path: /knowledge/{slug}/
          title: {title}
          summary: {summary}
          tag: {tag}
          meta: {meta}
          shell: knowledge-shell-index-only
          status: live
    - step: 4
      name: 更新知识库主页卡片
      action: "在 site_clone/knowledge/index.html 的卡片区加一张新卡片"
      note: 卡片格式同 fsqca/zhang-gen-li-lun 现有卡片
    - step: 5
      name: commit + push + 验证
      action: |
        git add knowledge/{slug}/ knowledge/index.html site.yml
        git commit -m "feat(knowledge): 挂载 {title} 子站"
        git push origin master
        curl 验证远端 index.html 含 site-header
  shell_types:
    knowledge-shell-index-only:
      description: "仅 index.html 加外壳,子页原样(扎根理论模式)"
      applies_to: index.html
      blocks: [site-header, site-footer, site.css]
    knowledge-shell-full:
      description: "所有子页都加外壳+breadcrumb+hero(完整 fsqca 模式)"
      applies_to: all pages
      blocks: [site-header, breadcrumb, lesson-hero, lesson-nav, site-footer, site.css]
  rules:
    - 不改子页 CSS/布局,只改 index.html
    - site-header 的 active 链接指向当前子站路径
    - footer-counter 不蒜子必须居中(class="footer-counter")
    - 不准自己改 accent 色;要改先问张剑

# -------------------------------------------------------------
# 七、维护者
# -------------------------------------------------------------
maintainer:
  name: 张剑
  note: 本文件改一次,commit 一次;AI 不得擅改 site.yml

# -------------------------------------------------------------
# 八、首页问答组件(ask)
#   实装:2026-10-11。只放首页,不进导航。
#   链路:index.html 的 .ask-section → assets/ask.js → Cloudflare Worker → 模型接口
#   密钥只存 Cloudflare secret,不进仓库,不进浏览器
# -------------------------------------------------------------
ask:
  enabled: true
  frontend:
    markup: index.html 的 <section class="ask-section" id="ask">
    script: assets/ask.js
    style: assets/ask.css
    endpoint_key: assets/ask.js 顶部的 ENDPOINT 常量,填 Worker 地址
  worker:
    dir: worker/
    entry: worker/src/index.js
    counter: worker/src/counter.js
    api_path: /api/ask
    local_test: npx wrangler dev
    deploy: npx wrangler deploy
    secret: npx wrangler secret put UPSTREAM_API_KEY
  limits:
    per_ip_per_day: 10
    global_per_day: 50
    reset: 北京时间 00:00
    over_limit: 硬停止,返回 429 与提示文案
  copy_rules:
    - 面板下方固定显示「回答由大模型生成,可能出错。」
    - 范围外的问题回答「这个问题我答不了,请看知识库 /knowledge/。」
  upstream:
    default: MiniMax Responses 接口 https://api.minimax.cn/v1/responses
    system_prompt_field: instructions
    history_field: input
    reasoning_effort: high,写在 worker/wrangler.toml 的 REASONING_EFFORT
    max_output_tokens: 4096,推理 token 计入这个上限,设小会返回 incomplete 且没有正文
    model_default: MiniMax-M3.1-Flash-Preview,配 Token Plan 订阅 Key(sk-cp- 前缀)
    model_alternate: MiniMax-M3,配按量付费 Key(sk-api- 前缀)
    keys: 按量付费 Key 与订阅 Key 不可互换;区域填错会返回 401 与业务码 1004 / 2049
    billing: Token Plan 按订阅配额扣减,不走按 token 计费
    local_key: worker/.dev.vars 写 UPSTREAM_API_KEY,该文件已在 .gitignore 中
  note: 系统提示词只写入站点结构、知识库专栏、联系方式;不写课件正文